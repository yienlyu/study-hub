<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 386" role="img" aria-label="跨膜孔洞兩種來源：CTL 與 NK 釋放 perforin，在 Ca²⁺ 存在下於目標細胞膜聚合成孔，granzyme 經孔進入細胞、活化 caspase 造成 apoptosis；補體 C5b678 加上多個 C9 聚合成 MAC 孔洞，水與離子湧入造成 osmotic lysis。IL-1、IL-2、hapten、antigen 都不會造成跨膜通道。">
<defs><marker id="pf-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker></defs>
<text x="10" y="24" class="th">CTL / NK · GRANULE 路徑</text><text x="10" y="44" class="tb">perforin 打洞 → granzyme 進去</text>
<rect x="6" y="58" width="110" height="172" rx="14" class="fp" style="fill:color-mix(in srgb, var(--violet) 7%, transparent)"/>
<text x="14" y="76" class="ts tb">CTL / NK</text>
<g class="hot" data-tip="<b>Cytotoxic granule</b>：內含 <b>perforin</b>、<b>granzymes</b>（serine protease）、granulysin，與 serglycin 結合。TCR 認到 pMHC I（或 NK 活化訊號 &gt; 抑制訊號）後往接觸點<b>定向釋放</b>。" data-label="Granule">
<circle cx="66" cy="112" r="12" class="bv"/><circle cx="62" cy="109" r="2.6" class="fr"/><circle cx="70" cy="115" r="2.6" class="fv"/>
<circle cx="88" cy="144" r="12" class="bv"/><circle cx="84" cy="141" r="2.6" class="fr"/><circle cx="92" cy="147" r="2.6" class="fv"/>
<circle cx="62" cy="180" r="12" class="bv"/><circle cx="58" cy="177" r="2.6" class="fr"/><circle cx="66" cy="183" r="2.6" class="fv"/>
<text x="62" y="212" text-anchor="middle" class="ts">granules</text></g>
<rect x="230" y="58" width="146" height="172" rx="14" class="fp"/>
<text x="246" y="76" class="ts tb">目標細胞</text>
<path d="M230 66V124M230 156V222" class="ln" style="stroke-width:2.4"/>
<g class="hot" data-tip="<b>Perforin</b>：在 <b>Ca²⁺</b> 存在下插入目標細胞膜、<b>聚合成跨膜孔洞（transmembrane channel）</b>。構造與補體 <b>C9</b> 同源。考古：「causes transmembrane channels in target cells」→ perforin。" data-label="Perforin">
<rect x="222" y="110" width="16" height="14" rx="3" class="fr"/><rect x="222" y="156" width="16" height="14" rx="3" class="fr"/>
<text x="216" y="106" text-anchor="end" class="ts tr tb">perforin 孔洞</text></g>
<text x="150" y="128" text-anchor="middle" class="ts">Ca²⁺</text>
<circle cx="140" cy="140" r="4" class="fv"/><circle cx="162" cy="140" r="4" class="fv"/>
<path d="M174 140H268" class="lv" marker-end="url(#pf-a)" style="stroke-width:1.8"/>
<g class="hot" data-tip="<b>Granzymes</b>：經 perforin 孔洞進入 cytosol；<b>granzyme B</b> 切 Bid 與 pro-caspase 3 → 粒線體釋出 cytochrome c → <b>caspase 3</b> → CAD 切 DNA。" data-label="Granzyme"><text x="160" y="162" text-anchor="middle" class="ts tv tb">granzyme</text></g>
<text x="318" y="128" text-anchor="middle" class="tb" style="font-size:12px">caspase 活化</text>
<text x="318" y="146" text-anchor="middle" class="ts">→ DNA 斷裂</text>
<text x="318" y="184" text-anchor="middle" class="tb tr" style="font-size:13px">apoptosis</text>
<rect x="6" y="242" width="370" height="50" rx="10" class="bv"/>
<text x="191" y="263" text-anchor="middle" class="tb" style="font-size:12px">需 Ca²⁺ · perforin 在膜上聚合成跨膜孔洞</text>
<text x="191" y="281" text-anchor="middle" style="font-size:12px">細胞自己凋亡（不是脹破），旁邊細胞不受影響</text>
<text x="408" y="24" class="th">補體 · MAC（C5b–9）</text><text x="408" y="44" class="tb">另一種跨膜孔洞</text>
<rect x="640" y="58" width="134" height="172" rx="14" class="fp"/>
<text x="652" y="76" class="ts tb">細菌／目標細胞</text>
<path d="M640 66V124M640 156V222" class="ln" style="stroke-width:2.4"/>
<g class="hot" data-tip="<b>MAC（membrane attack complex）</b>：C5b 依序接上 C6、C7、C8，再招來 <b>多個 C9 聚合成孔</b>。三條補體路徑最後的共同終點，功能 = <b>溶解（lysis）</b>。" data-label="MAC">
<rect x="632" y="110" width="16" height="14" rx="3" class="fw"/><rect x="632" y="156" width="16" height="14" rx="3" class="fw"/>
<text x="626" y="106" text-anchor="end" class="ts tb" style="fill:var(--warn)">poly-C9 孔洞</text>
<rect x="530" y="176" width="80" height="26" rx="8" class="bp"/><text x="570" y="193" text-anchor="middle" class="ts tb">C5b678</text>
<path d="M610 189H624V170" class="ln"/></g>
<path d="M452 140H690" class="ln" marker-end="url(#pf-a)" style="stroke-width:1.8"/>
<text x="520" y="130" text-anchor="middle" class="ts">H₂O、離子湧入</text>
<text x="710" y="128" text-anchor="middle" class="tb" style="font-size:12px">細胞脹大</text>
<text x="710" y="184" text-anchor="middle" class="tb" style="font-size:13px;fill:var(--warn)">osmotic lysis</text>
<rect x="404" y="242" width="370" height="50" rx="10" class="bw"/>
<text x="589" y="263" text-anchor="middle" class="tb" style="font-size:12px">C9 聚合成孔 · 構造與 perforin 同源</text>
<text x="589" y="281" text-anchor="middle" style="font-size:12px">細胞被滲透壓脹破（lysis）</text>
<path d="M6 306H774" class="lt dash"/>
<text x="10" y="324" class="th">其他選項 · 都不會造成跨膜通道</text>
<rect x="6" y="334" width="186" height="46" rx="10" class="bp"/>
<text x="99" y="353" text-anchor="middle" class="tb" style="font-size:12px">IL-1</text><text x="99" y="370" text-anchor="middle" class="ts">macrophage · 發燒、發炎</text>
<rect x="200" y="334" width="186" height="46" rx="10" class="bp"/>
<text x="293" y="353" text-anchor="middle" class="tb" style="font-size:12px">IL-2</text><text x="293" y="370" text-anchor="middle" class="ts">T 細胞生長因子 · 增殖</text>
<rect x="394" y="334" width="186" height="46" rx="10" class="bp"/>
<text x="487" y="353" text-anchor="middle" class="tb" style="font-size:12px">Hapten</text><text x="487" y="370" text-anchor="middle" class="ts">小分子 · 要接 carrier 才有免疫原性</text>
<rect x="588" y="334" width="186" height="46" rx="10" class="bp"/>
<text x="681" y="353" text-anchor="middle" class="tb" style="font-size:12px">Antigen</text><text x="681" y="370" text-anchor="middle" class="ts">被辨識的對象 · 本身不打洞</text>
</svg>
