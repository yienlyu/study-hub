<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-label="Lac operon：沒有乳糖時 repressor 結合 operator，轉錄關閉；有乳糖時 allolactose 讓 repressor 脫離；葡萄糖多時 cAMP 低、CAP 不結合，只有少量轉錄；葡萄糖少時 cAMP-CAP 結合 promoter 上游，大量轉錄">
<defs><marker id="lc-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker><marker id="lc-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fr"/></marker><marker id="lc-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fg"/></marker></defs>
<text x="20" y="26" class="th">LAC OPERON · 基因排列</text>
<path d="M20 66H760" class="ln" style="stroke-width:2"/>
<g class="hot" data-tip="<b>lacI</b>：調節基因，有自己的 promoter、<b>持續表現</b>，產生<b>有活性的 repressor</b>（四聚體）。" data-label="lacI"><rect x="20" y="53" width="56" height="26" rx="4" class="bp"/><text x="48.0" y="70.5" text-anchor="middle" class="ts">lacI</text></g>
<path d="M80 66H124" class="lt dash" style="stroke-width:2"/>
<g class="hot" data-tip="<b>CAP site</b>：cAMP–CAP 複合體結合的位置，在 promoter 上游；結合後把 DNA 彎曲、幫 RNA polymerase 結合 → <b>positive regulation</b>。" data-label="CAP site"><rect x="130" y="53" width="52" height="26" rx="4" class="bg"/><text x="156.0" y="70.5" text-anchor="middle" class="ts">CAP</text></g>
<rect x="182" y="53" width="36" height="26" rx="4" class="bp"/><text x="200.0" y="70.5" text-anchor="middle" class="tb">P</text>
<g class="hot" data-tip="<b>Operator</b>：repressor 結合處，擋住 RNA polymerase → <b>negative regulation</b>。" data-label="Operator"><rect x="218" y="53" width="36" height="26" rx="4" class="bw"/><text x="236.0" y="70.5" text-anchor="middle" class="tb">O</text></g>
<g class="hot" data-tip="<b>β-galactosidase</b>：把乳糖切成葡萄糖 + 半乳糖；也會把乳糖轉成 <b>allolactose（真正的 inducer）</b>。" data-label="lacZ"><rect x="254" y="53" width="130" height="26" rx="4" class="bx"/><text x="319.0" y="70.5" text-anchor="middle" class="ts">lacZ</text></g>
<g class="hot" data-tip="<b>Permease</b>：把乳糖運進細胞。" data-label="lacY"><rect x="384" y="53" width="90" height="26" rx="4" class="bx"/><text x="429.0" y="70.5" text-anchor="middle" class="ts">lacY</text></g>
<g class="hot" data-tip="<b>Transacetylase</b>：乙醯化 β-半乳糖苷（功能較次要）。" data-label="lacA"><rect x="474" y="53" width="80" height="26" rx="4" class="bx"/><text x="514.0" y="70.5" text-anchor="middle" class="ts">lacA</text></g>
<text x="404.0" y="98" text-anchor="middle" class="ts">三個結構基因一起轉錄成一條 polycistronic mRNA</text>
<path d="M20 112H760" class="lt"/><text x="20" y="142" class="tb">① 沒有乳糖</text><text x="20" y="162" class="ts">葡萄糖多或少都一樣</text><path d="M190 176H560" class="ln" style="stroke-width:2"/><rect x="200" y="164" width="46" height="24" rx="4" class="bp"/><text x="223.0" y="180.5" text-anchor="middle" class="ts">CAP</text><rect x="246" y="164" width="34" height="24" rx="4" class="bp"/><text x="263.0" y="180.5" text-anchor="middle" class="ts">P</text><rect x="280" y="164" width="34" height="24" rx="4" class="bw"/><text x="297.0" y="180.5" text-anchor="middle" class="ts">O</text><rect x="314" y="164" width="200" height="24" rx="4" class="bx"/><text x="414.0" y="180.5" text-anchor="middle" class="ts">lacZ · lacY · lacA</text><path d="M273 166V146q0 -8 8 -8h6l6 8l6 -8h6q8 0 8 8V166z" class="bv"/><path d="M297 166V163" class="lv" style="stroke-width:2.4"/><path d="M246 204H276" class="lr" style="stroke-width:2"/><path d="M266 196l12 16M278 196l-12 16" class="lr" style="stroke-width:2.2"/><text x="580" y="180" class="tb tr">OFF</text><text x="618" y="180" class="ts">不需要分解乳糖</text>
<path d="M20 220H760" class="lt"/><text x="20" y="250" class="tb">② 有乳糖＋有葡萄糖</text><text x="20" y="270" class="ts">葡萄糖多 → cAMP 低</text><text x="20" y="286" class="ts">→ CAP 不結合</text><path d="M190 284H560" class="ln" style="stroke-width:2"/><rect x="200" y="272" width="46" height="24" rx="4" class="bp"/><text x="223.0" y="288.5" text-anchor="middle" class="ts">CAP</text><rect x="246" y="272" width="34" height="24" rx="4" class="bp"/><text x="263.0" y="288.5" text-anchor="middle" class="ts">P</text><rect x="280" y="272" width="34" height="24" rx="4" class="bw"/><text x="297.0" y="288.5" text-anchor="middle" class="ts">O</text><rect x="314" y="272" width="200" height="24" rx="4" class="bx"/><text x="414.0" y="288.5" text-anchor="middle" class="ts">lacZ · lacY · lacA</text><path d="M328 264V246q0 -10 10 -10h4l7 3l7 -3h4q10 0 10 10V264q-12 6 -24 6t-24 -6z" class="bx dash"/><circle cx="352" cy="240" r="6" class="fw"/><path d="M326 262Q310 268 300 271" class="lt dash"/><text x="384" y="254" class="ts">allolactose 讓 repressor 脫離</text><path d="M248 312H508" class="lg dash" marker-end="url(#lc-ag)" style="stroke-width:1.4"/><text x="580" y="288" class="tb" style="fill:var(--warn)">少量</text><text x="618" y="288" class="ts">先用葡萄糖</text>
<g class="hot" data-tip="<b>Catabolite repression</b>：葡萄糖多時 cAMP 低，CAP 沒有 cAMP 就結合不上 → 即使有乳糖也只有少量轉錄。<br>考點：<b>葡萄糖高 → cAMP–CAP 減少</b>（不是增加）。" data-label="catabolite repression"><text x="20" y="300" class="ts tv">catabolite repression</text></g>
<path d="M20 328H760" class="lt"/><text x="20" y="358" class="tb">③ 有乳糖＋沒有葡萄糖</text><text x="20" y="378" class="ts">葡萄糖少 → cAMP↑</text><text x="20" y="394" class="ts">→ cAMP–CAP 結合</text><path d="M190 392H560" class="ln" style="stroke-width:2"/><rect x="200" y="380" width="46" height="24" rx="4" class="bg"/><text x="223.0" y="396.5" text-anchor="middle" class="ts">CAP</text><rect x="246" y="380" width="34" height="24" rx="4" class="bp"/><text x="263.0" y="396.5" text-anchor="middle" class="ts">P</text><rect x="280" y="380" width="34" height="24" rx="4" class="bw"/><text x="297.0" y="396.5" text-anchor="middle" class="ts">O</text><rect x="314" y="380" width="200" height="24" rx="4" class="bx"/><text x="414.0" y="396.5" text-anchor="middle" class="ts">lacZ · lacY · lacA</text><rect x="203" y="352" width="40" height="22" rx="11" class="bg"/><text x="223" y="367" text-anchor="middle" class="ts" style="fill:var(--good);font-weight:650">CAP</text><circle cx="243" cy="352" r="7" class="fg"/><text x="256" y="348" class="ts" style="fill:var(--good)">cAMP</text><path d="M223 374V379" class="lg" style="stroke-width:2.4"/><path d="M328 372V354q0 -10 10 -10h4l7 3l7 -3h4q10 0 10 10V372q-12 6 -24 6t-24 -6z" class="bx dash"/><circle cx="352" cy="348" r="6" class="fw"/><path d="M326 370Q310 376 300 379" class="lt dash"/><text x="384" y="362" class="ts">allolactose 讓 repressor 脫離</text><path d="M248 420H508" class="lg" marker-end="url(#lc-ag)" style="stroke-width:4"/><text x="580" y="396" class="tb" style="fill:var(--good)">大量</text><text x="618" y="396" class="ts">改吃乳糖</text>
<path d="M20 436H760" class="lt"/>
<text x="20" y="462" class="ts"><tspan class="tb" style="fill:var(--ink)">乳糖 = 開關</tspan>：repressor 管 on／off（negative control）</text>
<text x="400" y="462" class="ts"><tspan class="tb" style="fill:var(--ink)">葡萄糖 = 音量</tspan>：cAMP–CAP 管多寡（positive control）</text>
<text x="20" y="484" class="ts">Inducible operon：預設 OFF；inducer 是 <tspan class="tb" style="fill:var(--ink)">allolactose</tspan>（實驗常用不會被分解的 IPTG）</text>
</svg>