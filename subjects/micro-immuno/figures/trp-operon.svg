<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-label="Tryptophan operon：trpE 到 trpA 五個結構基因共用 promoter 與 operator；Trp 多時 Trp 當 corepressor 活化 TrpR 結合 operator；另有 attenuation，Trp 多時 leader 區 3–4 形成終止髮夾，Trp 少時核糖體停在 region 1，2–3 形成抗終止結構而繼續轉錄">
<defs><marker id="tp-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker><marker id="tp-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fr"/></marker><marker id="tp-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fg"/></marker></defs>
<text x="20" y="26" class="th">TRP OPERON · 基因排列</text>
<path d="M20 70H760" class="ln" style="stroke-width:2"/>
<g class="hot" data-tip="<b>trpR</b> 在染色體別處，自己持續表現，產生<b>無活性的 TrpR aporepressor</b>。" data-label="trpR"><rect x="20" y="57" width="56" height="26" rx="4" class="bp"/><text x="48.0" y="74.5" text-anchor="middle" class="ts">trpR</text></g>
<path d="M80 70H112" class="lt dash" style="stroke-width:2"/>
<rect x="118" y="57" width="34" height="26" rx="4" class="bp"/><text x="135.0" y="74.5" text-anchor="middle" class="tb">P</text>
<g class="hot" data-tip="<b>Operator</b> 和 promoter 重疊；TrpR–Trp 複合體結合後 RNA polymerase 就上不去。" data-label="Operator"><rect x="152" y="57" width="32" height="26" rx="4" class="bw"/><text x="168.0" y="74.5" text-anchor="middle" class="tb">O</text></g>
<g class="hot" data-tip="<b>trpL（leader）</b>：結構基因前的一段 162 nt 前導序列，含 region 1–4，負責 <b>attenuation</b>。region 1 有<b>兩個相鄰的 Trp codon</b>。" data-label="leader trpL"><rect x="184" y="57" width="96" height="26" rx="4" class="bv"/><text x="232.0" y="74.5" text-anchor="middle" class="ts">leader 1 2 3 4</text></g>
<rect x="280" y="57" width="72" height="26" rx="4" class="bx"/><text x="316.0" y="74.5" text-anchor="middle" class="ts">trpE</text>
<rect x="352" y="57" width="72" height="26" rx="4" class="bx"/><text x="388.0" y="74.5" text-anchor="middle" class="ts">trpD</text>
<rect x="424" y="57" width="72" height="26" rx="4" class="bx"/><text x="460.0" y="74.5" text-anchor="middle" class="ts">trpC</text>
<rect x="496" y="57" width="72" height="26" rx="4" class="bx"/><text x="532.0" y="74.5" text-anchor="middle" class="ts">trpB</text>
<rect x="568" y="57" width="72" height="26" rx="4" class="bx"/><text x="604.0" y="74.5" text-anchor="middle" class="ts">trpA</text>
<text x="460" y="104" text-anchor="middle" class="ts">5 個結構基因 → 一條 polycistronic mRNA → 合成 Trp 的酵素</text>
<path d="M20 128H760" class="lt"/>
<text x="20" y="152" class="th">第一層 · REPRESSION（開或關）</text>
<text x="20" y="180" class="tb">Trp 少</text>
<path d="M86 206V188q0 -10 10 -10h4l7 3l7 -3h4q10 0 10 10V206q-12 6 -24 6t-24 -6z" class="bx dash"/>
<text x="146" y="188" class="ts">TrpR 無活性</text><text x="146" y="203" class="ts">接不上 operator</text>
<path d="M250 194H352" class="lg" marker-end="url(#tp-ag)"/>
<text x="301" y="186" text-anchor="middle" class="ts" style="fill:var(--good)">轉錄 ON</text>
<text x="400" y="180" class="tb">Trp 多</text>
<path d="M466 206V186q0 -8 8 -8h6l6 8l6 -8h6q8 0 8 8V206z" class="bv"/>
<polygon points="483,174 497,174 490,185" class="fr"/>
<g class="hot" data-tip="<b>Trp 是 corepressor</b>：結合 TrpR 讓它變形活化，複合體再結合 operator。" data-label="Trp 當 corepressor"><text x="526" y="188" class="ts" style="fill:var(--violet);font-weight:650">Trp + TrpR</text><text x="526" y="203" class="ts" style="fill:var(--violet)">→ 結合 operator</text></g>
<path d="M640 194H730" class="lr" style="stroke-width:2"/>
<path d="M678 184l14 20M692 184l-14 20" class="lr" style="stroke-width:2.4"/>
<text x="685" y="178" text-anchor="middle" class="ts tr">轉錄 OFF</text>
<text x="20" y="236" class="ts">只靠 repression 還關不乾淨 → 有少量 RNA polymerase 漏過去時，再由 attenuation 微調</text>
<path d="M20 252H760" class="lt"/>
<g class="hot" data-tip="<b>Attenuation（減弱作用）</b>：細菌<b>轉錄與轉譯同時進行</b>，核糖體跟在 RNA polymerase 後面翻譯 leader peptide，走得快慢決定 leader mRNA 摺成哪一種髮夾。<b>真核細胞沒有</b>。" data-label="Attenuation"><text x="20" y="276" class="th">第二層 · ATTENUATION（轉錄提早結束與否）</text></g>
<path d="M389 292V540" class="lt dash"/>
<text x="20" y="306" class="tb">Trp 充足</text><text x="92" y="306" class="ts">有足夠的 Trp-tRNA</text><path d="M20 442H370" class="lv" style="stroke-width:1.8"/><rect x="112" y="402" width="76" height="36" rx="16" class="bp"/><text x="150" y="424" text-anchor="middle" class="ts">核糖體</text><text x="150" y="458" text-anchor="middle" class="ts">蓋住 region 2</text><text x="80" y="458" text-anchor="middle" class="ts">1 已翻完</text><path d="M248 442V380a7 7 0 0 1 14 0V442" class="lr" style="stroke-width:2.2"/><path d="M249 435H261" class="lr" style="stroke-width:1;opacity:.6"/><path d="M249 428H261" class="lr" style="stroke-width:1;opacity:.6"/><path d="M249 421H261" class="lr" style="stroke-width:1;opacity:.6"/><path d="M249 414H261" class="lr" style="stroke-width:1;opacity:.6"/><path d="M249 407H261" class="lr" style="stroke-width:1;opacity:.6"/><path d="M249 400H261" class="lr" style="stroke-width:1;opacity:.6"/><path d="M249 393H261" class="lr" style="stroke-width:1;opacity:.6"/><text x="243" y="440" text-anchor="end" class="ts">3</text><text x="267" y="440" class="ts">4</text><g class="hot" data-tip="region <b>3–4 配對</b>，後面接一串 U → 形成<b>不依賴 rho 的終止子（terminator）</b>，RNA polymerase 脫落。" data-label="3–4 terminator"><text x="255" y="366" text-anchor="middle" class="ts tr" style="font-weight:650">3–4 終止髮夾</text></g><text x="320" y="436" class="ts">UUUU</text><text x="20" y="490" class="ts">核糖體很快翻過兩個 Trp codon，</text><text x="20" y="506" class="ts">region 2 被核糖體佔住 → 3 只能和 4 配對</text><text x="20" y="532" class="tb tr">→ 轉錄在 leader 就結束</text>
<text x="410" y="306" class="tb">Trp 缺乏</text><text x="482" y="306" class="ts">Trp-tRNA 不夠</text><path d="M410 442H760" class="lv" style="stroke-width:1.8"/><rect x="432" y="402" width="76" height="36" rx="16" class="bp"/><text x="470" y="424" text-anchor="middle" class="ts">核糖體</text><g class="hot" data-tip="region 1 有兩個連續的 <b>Trp codon</b>（UGG UGG）；缺 Trp-tRNA 時核糖體就<b>停在這裡等</b>。" data-label="停在 Trp codon"><text x="470" y="458" text-anchor="middle" class="ts tr">卡在 Trp codon</text></g><path d="M568 442V380a7 7 0 0 1 14 0V442" class="lg" style="stroke-width:2.2"/><path d="M569 435H581" class="lg" style="stroke-width:1;opacity:.6"/><path d="M569 428H581" class="lg" style="stroke-width:1;opacity:.6"/><path d="M569 421H581" class="lg" style="stroke-width:1;opacity:.6"/><path d="M569 414H581" class="lg" style="stroke-width:1;opacity:.6"/><path d="M569 407H581" class="lg" style="stroke-width:1;opacity:.6"/><path d="M569 400H581" class="lg" style="stroke-width:1;opacity:.6"/><path d="M569 393H581" class="lg" style="stroke-width:1;opacity:.6"/><text x="563" y="440" text-anchor="end" class="ts">2</text><text x="587" y="440" class="ts">3</text><g class="hot" data-tip="region <b>2–3 配對</b>成 <b>anti-terminator</b>：3 被 2 拉走，3–4 終止子就摺不出來。" data-label="2–3 anti-terminator"><text x="575" y="366" text-anchor="middle" class="ts" style="fill:var(--good);font-weight:650">2–3 抗終止髮夾</text></g><text x="680" y="458" text-anchor="middle" class="ts">4 沒有配對</text><path d="M710 428H760" class="lg" marker-end="url(#tp-ag)"/><text x="410" y="490" class="ts">核糖體停在 region 1，region 2 空出來，</text><text x="410" y="506" class="ts">先和 3 配對 → 3–4 終止子無法形成</text><text x="410" y="532" class="tb" style="fill:var(--good)">→ 繼續轉錄 trpE–trpA</text>
</svg>