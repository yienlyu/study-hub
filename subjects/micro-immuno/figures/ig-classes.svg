<g transform="translate(20 284)"><path d="M0 0h18" class="lv" style="stroke-width:4.2;stroke-linecap:round"/><text x="26" y="4" class="ts">重鏈 heavy chain（決定 class）</text><path d="M220 0h18" class="lr" style="stroke-width:3.4;stroke-linecap:round"/><text x="246" y="4" class="ts">輕鏈 κ 或 λ</text><circle cx="352" cy="0" r="5" class="fw"/><text x="364" y="4" class="ts">J chain</text><path d="M430 0h18" class="lg" style="stroke-width:3.4;stroke-linecap:round"/><text x="456" y="4" class="ts">secretory component</text><path d="M596 -3h12M596 1h12" class="ln" style="stroke-width:1.2"/><text x="616" y="4" class="ts">hinge</text></g>
</svg>
