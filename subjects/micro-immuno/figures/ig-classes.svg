<text x="702" y="130" class="ts">CH4</text>
<g class="hot" data-tip="<b>佔 70–75%</b>（最多）；<b>次級反應主力</b>；<b>唯一能通過胎盤</b>（所有 subclass）；活化補體（IgG1–3）、經 FcγR 調理。" data-label="IgG"><text x="80" y="178" text-anchor="middle" class="tb" style="font-size:15px">IgG</text></g>
<text x="80" y="196" text-anchor="middle" class="ts">monomer</text>
<text x="80" y="220" text-anchor="middle" class="ts" style="fill:var(--ink-2)">70–75%，最多</text>
<text x="80" y="237" text-anchor="middle" class="ts" style="fill:var(--ink-2)">唯一過胎盤</text>
<text x="80" y="254" text-anchor="middle" class="ts" style="fill:var(--ink-2)">次級反應主力</text>
<g class="hot" data-tip="<b>初級反應主力</b>；<b>最強補體活化</b>；侷限在血管內，代表<b>現在的感染</b>。膜上是 monomer。<b>無 hinge</b>（4 個 CH）。" data-label="IgM"><text x="230" y="178" text-anchor="middle" class="tb" style="font-size:15px">IgM</text></g>
<text x="230" y="196" text-anchor="middle" class="ts">pentamer + J chain</text>
<text x="230" y="220" text-anchor="middle" class="ts" style="fill:var(--ink-2)">初級反應主力</text>
<text x="230" y="237" text-anchor="middle" class="ts" style="fill:var(--ink-2)">最強補體活化</text>
<text x="230" y="254" text-anchor="middle" class="ts" style="fill:var(--ink-2)">無 hinge</text>
<g class="hot" data-tip="<b>黏膜分泌物主力</b>。血中多為 monomer；分泌型為 dimer + J chain + <b>secretory component</b>（上皮細胞的 poly-Ig receptor 切剩的部分，保護不被 protease 分解）。<b>TGF-β</b> 促進 class switch 到 IgA。" data-label="IgA"><text x="400" y="178" text-anchor="middle" class="tb" style="font-size:15px">IgA</text></g>
<text x="400" y="196" text-anchor="middle" class="ts">dimer + J + SC</text>
<text x="400" y="220" text-anchor="middle" class="ts" style="fill:var(--ink-2)">黏膜、乳汁</text>
<text x="400" y="237" text-anchor="middle" class="ts" style="fill:var(--ink-2)">SC 由上皮製造</text>
<text x="400" y="254" text-anchor="middle" class="ts" style="fill:var(--ink-2)">不活化補體</text>
<g class="hot" data-tip="<1%；<b>B 細胞膜上的受體</b>（與 IgM 共表現於 mature B），分泌型功能不明。" data-label="IgD"><text x="560" y="178" text-anchor="middle" class="tb" style="font-size:15px">IgD</text></g>
<text x="560" y="196" text-anchor="middle" class="ts">monomer</text>
<text x="560" y="220" text-anchor="middle" class="ts" style="fill:var(--ink-2)">B 細胞膜受體</text>
<text x="560" y="237" text-anchor="middle" class="ts" style="fill:var(--ink-2)">與 IgM 共表現</text>
<g class="hot" data-tip="極少；<b>寄生蟲與過敏</b>，經 <b>FcεRI</b> 結合 mast cell / basophil；<b>無 hinge</b>（4 個 CH）。IL-4 → IgE。" data-label="IgE"><text x="690" y="178" text-anchor="middle" class="tb" style="font-size:15px">IgE</text></g>
<text x="690" y="196" text-anchor="middle" class="ts">monomer</text>
<text x="690" y="220" text-anchor="middle" class="ts" style="fill:var(--ink-2)">過敏、寄生蟲</text>
<text x="690" y="237" text-anchor="middle" class="ts" style="fill:var(--ink-2)">FcεRI → mast cell</text>
<text x="690" y="254" text-anchor="middle" class="ts" style="fill:var(--ink-2)">無 hinge</text>
