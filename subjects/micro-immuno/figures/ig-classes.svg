<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" role="img" aria-label="五種抗體結構比較：IgG 單體、IgM 五聚體加 J 鏈、分泌型 IgA 二聚體加 J 鏈與 secretory component、IgD 與 IgE 單體，IgM 與 IgE 無 hinge">
