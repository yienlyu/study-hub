<text x="406" y="312" style="font-size:11.5px">PSGN、SLE</text>
<rect x="586" y="32" width="182" height="296" rx="12" class="bp"/>
<g class="hot" data-tip="<b>Type IV</b>：<b>不靠抗體</b>。肉芽腫：清不掉的微生物被 <b>epithelioid cells</b>（活化的 macrophage）與多核巨細胞包圍。" data-label="Type IV"><rect x="596" y="42" width="162" height="50" rx="9" class="bg"/><text x="608" y="64" class="tb" style="font-size:15px">Type IV</text><text x="608" y="82" class="ts">遲發型 Delayed</text></g>
<text x="598" y="114" class="tb" style="font-size:12px">TH1、CD8 T、macrophage</text>
<text x="598" y="138" class="ts">致敏 T 細胞再遇抗原</text>
<text x="598" y="156" class="ts">→ IFN-γ 活化 macrophage</text>
<text x="598" y="174" class="ts">　或 CTL 直接毒殺</text>
<text x="598" y="232" class="th">多久出現</text>
<text x="598" y="250" style="font-size:12px">24–72 小時</text>
<text x="598" y="278" class="th">例子</text>
<text x="598" y="296"></text>
