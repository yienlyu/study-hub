<text x="598" y="296"></text>
<text x="598" y="296" style="font-size:11.5px">結核菌素試驗、接觸性皮膚炎</text>
<text x="598" y="312" style="font-size:11.5px">肉芽腫</text>
<text x="10" y="346" class="ts">記法 ACID：Anaphylactic、Cytotoxic、Immune complex、Delayed</text>
