lass="bw"/><text x="328.0" y="121" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">Cγ…</text>
<path d="M236 132V146" class="ln" marker-end="url(#vj-a)"/><text x="246" y="142" class="ts tb" style="fill:var(--ink)">② 再 V–DJ</text>
<text x="20" y="160" class="ts"></text><path d="M20 175H440" class="lt"/><rect x="20" y="166" width="24" height="18" rx="3" class="bv"/><text x="32.0" y="179" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">V1</text><rect x="47" y="166" width="24" height="18" rx="3" class="bv"/><text x="59.0" y="179" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">V2</text><rect x="71" y="166" width="18" height="18" rx="3" class="br"/><text x="80.0" y="179" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">D2</text><rect x="89" y="166" width="18" height="18" rx="3" class="bg"/><text x="98.0" y="179" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">J3</text><rect x="109" y="166" width="18" height="18" rx="3" class="bg"/><text x="118.0" y="179" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">J4</text><rect x="143" y="166" width="26" height="18" rx="3" class="bw"/><text x="156.0" y="179" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">Cμ</text><rect x="172" y="166" width="26" height="18" rx="3" class="bw"/><text x="185.0" y="179" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">Cδ</text><rect x="201" y="166" width="32" height="18" rx="3" class="bw"/><text x="217.0" y="179" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">Cγ…</text>
<path d="M236 190V204" class="ln" marker-end="url(#vj-a)"/><text x="246" y="200" class="ts tb" style="fill:var(--ink)">③ 轉錄 + RNA splicing</text>
<text x="20" y="218" class="ts">mRNA</text><rect x="20" y="224" width="24" height="18" rx="3" class="bv"/><text x="32.0" y="237" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">V2</text><rect x="44" y="224" width="18" height="18" rx="3" class="br"/><text x="53.0" y="237" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">D2</text><rect x="62" y="224" width="18" height="18" rx="3" class="bg"/><text x="71.0" y="237" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">J3</text><rect x="80" y="224" width="26" height="18" rx="3" class="bw"/><text x="93.0" y="237" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">Cμ</text>
<text x="124" y="237" class="ts">→ μ 重鏈（先表現 IgM）</text>
<path d="M20 262H450" class="lt"/>
<g class="hot" data-tip="輕鏈（κ、λ）由 <b>V、J、C</b> 編碼，<b>沒有 D</b>。順序 μ → κ → λ：κ 先重組，失敗才換 λ；成功後抑制另一個 allele（<b>allelic exclusion</b>）。" data-label="輕鏈 V–J 重組"><text x="20" y="284">輕鏈只有 V–J</text></g>
<text x="116" y="284" class="ts">（沒有 D）；κ 先、失敗才 λ</text>
<g class="hot" data-tip="RSS = heptamer – <b>12 或 23 bp spacer</b> – nonamer。只有 12-RSS 與 23-RSS 能配對重組 → 保證 V 接 D、D 接 J，不會 V 接 V。" data-label="RSS 12/23 rule"><text x="20" y="308">12/23 rule</text></g>
<text x="104" y="308" class="ts">RSS 的 spacer 12 只能配 23</text>
<g class="hot" data-tip="RAG-1/2 辨識 RSS 並切斷 DNA，coding end 形成<b>髮夾（hairpin）</b>。RAG 缺陷 → 沒有 B、T 細胞。" data-label="RAG-1 / RAG-2"><text x="582" y="58" class="tb" style="font-size:12.5px">RAG-1 / RAG-2</text></g>
<text x="582" y="75" class="ts">切開 DNA → 髮夾 hairpin</text>
<g class="hot" data-tip="Artemis 在不對稱的位置打開 hairpin → 多出一小段<b>回文序列</b> = <b>P-nucleotides</b>。" data-label="Artemis（DNA-PK）"><text x="582" y="128" class="tb" style="font-size:12.5px">Artemis（DNA-PK）</text></g>
<text x="582" y="145" class="ts">不對稱打開 → P nucleotides</text>
<g class="hot" data-tip="<b>TdT</b>（terminal deoxynucleotidyl transferase）<b>不需要模板</b>，隨機加入 <b>N-nucleotides</b>。（不是「辨識／標記 DNA 斷點」）" data-label="TdT"><text x="582" y="198" class="tb" style="font-size:12.5px">TdT</text></g>
<text x="582" y="215" class="ts">不需模板、隨機加 N</text>
<g class="hot" data-tip="Exonuclease 移除未配對鹼基，<b>DNA ligase IV</b> 接起來 → 形成最多變的 <b>CDR3</b>。加入的核苷酸數若不是 3 的倍數或出現 stop codon → 無功能、細胞死亡。" data-label="Exonuclease → Ligase IV"><text x="582" y="268" class="tb" style="font-size:12.5px">Exonuclease → Ligase IV</text></g>
<text x="582" y="285" class="ts">修剪 → 接合</text>
