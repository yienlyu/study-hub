<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 330" role="img" aria-label="抗體重鏈 V(D)J 重組：先 D–J、再 V–DJ，轉錄後接上 Cμ；接合處由 RAG 切開形成髮夾，Artemis 打開產生 P 核苷酸，TdT 加入 N 核苷酸，最後修剪並由 ligase IV 接合">
<defs><marker id="vj-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker>
