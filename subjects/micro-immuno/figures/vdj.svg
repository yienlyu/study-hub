<marker id="vj-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fr"/></marker>
<marker id="vj-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fg"/></marker></defs>
<text x="20" y="22" class="th">A · 重鏈基因重組（骨髓中的 B 細胞發育）</text><text x="480" y="22" class="th">B · JUNCTIONAL DIVERSITY</text>
<path d="M462 12V326" class="lt dash"/>
