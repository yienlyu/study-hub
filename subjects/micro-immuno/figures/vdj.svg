ext x="305.0" y="63" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">J4</text><rect x="330" y="50" width="26" height="18" rx="3" class="bw"/><text x="343.0" y="63" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">Cμ</text><rect x="359" y="50" width="26" height="18" rx="3" class="bw"/><text x="372.0" y="63" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">Cδ</text><rect x="388" y="50" width="32" height="18" rx="3" class="bw"/><text x="404.0" y="63" text-anchor="middle" class="ts " style="fill:var(--ink);font-size:10.5px">Cγ…</text>
