<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" role="img" aria-label="抗原處理兩條路徑：MHC I 路徑由 proteasome 切割、TAP 送入 ER 裝載後給 CD8 T 細胞；MHC II 路徑由 endosome 切割，在 MIIC 以 HLA-DM 將 CLIP 換成 peptide 後給 CD4 T 細胞；另有 autophagy 與 cross-presentation 兩條例外">
<defs><marker id="mp-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker>
<marker id="mp-av" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fv"/></marker>
<marker id="mp-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fr"/></marker>
<marker id="mp-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fg"/></marker></defs>
<circle cx="26" cy="18" r="6" class="fv"/><text x="38" y="23" class="tb">MHC I 路徑</text><text x="118" y="23" class="ts">cytosolic / endogenous → CD8⁺ T</text>
<rect x="20" y="36" width="122" height="78" rx="10" class="bx"/><text x="30" y="56" class="tb" style="font-size:12.5px">細胞質蛋白</text><text x="30" y="74" class="ts" style="fill:var(--ink-2)">病毒、胞內菌、DRiPs</text><text x="30" y="89" class="ts" style="fill:var(--ink-2)">接上 ubiquitin</text>
<rect x="160" y="36" width="122" height="78" rx="10" class="bx"/><g class="hot" data-tip="把 ubiquitin 標記的蛋白切成短 peptide。IFN-γ 誘導 <b>immunoproteasome</b>（LMP2、LMP7）。" data-label="Proteasome"><text x="170" y="56" class="tb" style="font-size:12.5px">Proteasome</text></g><text x="170" y="74" class="ts" style="fill:var(--ink-2)">切成短 peptide</text><text x="170" y="89" class="ts" style="fill:var(--ink-2)">LMP2、LMP7</text><text x="170" y="104" class="ts" style="fill:var(--ink-2)">（IFN-γ 誘導）</text>
<rect x="300" y="36" width="104" height="78" rx="10" class="bv"/><g class="hot" data-tip="ER 膜上的 <b>ATP-dependent</b> 運輸蛋白，偏好 8–16 aa、C 端疏水或鹼性；基因在 MHC 區，受 IFN 誘導。TAP 缺陷 → MHC I 表現下降。" data-label="TAP"><text x="310" y="56" class="tb" style="font-size:12.5px">TAP-1 / 2</text></g><text x="310" y="74" class="ts" style="fill:var(--ink-2)">ER 膜上</text><text x="310" y="89" class="ts" style="fill:var(--ink-2)">ATP 依賴</text><text x="310" y="104" class="ts" style="fill:var(--ink-2)">送 peptide 進 ER</text>
<rect x="422" y="36" width="184" height="78" rx="10" class="bv"/><g class="hot" data-tip="MHC I α 鏈先與 <b>calnexin</b> 結合；β2m 結合後組成 <b>peptide-loading complex</b>（calreticulin、tapasin、ERp57、TAP）；<b>ERAAP</b> 修剪過長 peptide，再裝上 MHC I。" data-label="ER 裝載 MHC I"><text x="432" y="56" class="tb" style="font-size:12.5px">ER：裝上 MHC I</text></g><text x="432" y="74" class="ts" style="fill:var(--ink-2)">calnexin → PLC（tapasin、</text><text x="432" y="89" class="ts" style="fill:var(--ink-2)">calreticulin、ERp57、TAP）</text><text x="432" y="104" class="ts" style="fill:var(--ink-2)">ERAAP 修剪過長的 peptide</text>
<rect x="624" y="36" width="116" height="78" rx="10" class="bx"/><text x="634" y="56" class="tb" style="font-size:12.5px">Golgi → 細胞膜</text><text x="634" y="74" class="ts" style="fill:var(--ink-2)">呈現給</text><text x="634" y="89" class="ts" style="fill:var(--ink-2)">CD8⁺ Tc</text>
<path d="M142 75.0H158" class="ln" marker-end="url(#mp-a)" style="stroke-width:1.6"/>
<path d="M282 75.0H298" class="ln" marker-end="url(#mp-a)" style="stroke-width:1.6"/>
<path d="M404 75.0H420" class="ln" marker-end="url(#mp-a)" style="stroke-width:1.6"/>
<path d="M606 75.0H622" class="ln" marker-end="url(#mp-a)" style="stroke-width:1.6"/>
<circle cx="26" cy="330" r="6" class="fr"/><text x="38" y="335" class="tb">MHC II 路徑</text><text x="38" y="353" class="ts">endocytic / exogenous → CD4⁺ T</text>
<rect x="20" y="206" width="122" height="78" rx="10" class="bx"/><text x="30" y="226" class="tb" style="font-size:12.5px">細胞外抗原</text><text x="30" y="244" class="ts" style="fill:var(--ink-2)">細菌、蛋白質</text>
<rect x="172" y="206" width="150" height="78" rx="10" class="br"/><g class="hot" data-tip="外源蛋白經 endocytosis / phagocytosis 進入 endosome → <b>酸化</b>、protease（cathepsins）切割。" data-label="Endosome"><text x="182" y="226" class="tb" style="font-size:12.5px">Endosome</text></g><text x="182" y="244" class="ts" style="fill:var(--ink-2)">酸化</text><text x="182" y="259" class="ts" style="fill:var(--ink-2)">cathepsins 切成 peptide</text>
<rect x="422" y="206" width="184" height="78" rx="10" class="br"/><g class="hot" data-tip="在 late endosome（MIIC）invariant chain 被切到只剩 <b>CLIP</b> 佔住槽；<b>HLA-DM</b> 催化 CLIP 離開、換上抗原 peptide；<b>HLA-DO</b> 抑制 HLA-DM。" data-label="MIIC"><text x="432" y="226" class="tb" style="font-size:12.5px">MIIC（late endosome）</text></g><text x="432" y="244" class="ts" style="fill:var(--ink-2)">Ii 被切到剩 CLIP</text><text x="432" y="259" class="ts" style="fill:var(--ink-2)">HLA-DM 把 CLIP 換成 peptide</text><text x="432" y="274" class="ts" style="fill:var(--ink-2)">（HLA-DO 抑制 HLA-DM）</text>
<rect x="624" y="206" width="116" height="78" rx="10" class="bx"/><text x="634" y="226" class="tb" style="font-size:12.5px">細胞膜</text><text x="634" y="244" class="ts" style="fill:var(--ink-2)">呈現給</text><text x="634" y="259" class="ts" style="fill:var(--ink-2)">CD4⁺ TH</text>
<path d="M142 245.0H170" class="ln" marker-end="url(#mp-a)" style="stroke-width:1.6"/><text x="146" y="237.0" class="ts">吞入</text>
<path d="M322 245.0H420" class="ln" marker-end="url(#mp-a)" style="stroke-width:1.6"/>
<path d="M606 245.0H622" class="ln" marker-end="url(#mp-a)" style="stroke-width:1.6"/>
<rect x="422" y="308" width="184" height="56" rx="10" class="bx"/><g class="hot" data-tip="MHC II 在 ER 與 <b>invariant chain（Ii）</b>結合：防止在 ER 裝上內源 peptide，並把 MHC II 送往 endosome。" data-label="Invariant chain"><text x="432" y="328" class="tb" style="font-size:12.5px">ER：MHC II + Ii</text></g><text x="432" y="346" class="ts" style="fill:var(--ink-2)">Ii 擋住槽、導向 endosome</text>
<path d="M514 308V286" class="ln" marker-end="url(#mp-a)" style="stroke-width:1.6"/>
<path d="M80 114V146H236V204" class="lr dash" marker-end="url(#mp-ar)" style="stroke-width:1.5"/>
<g class="hot" data-tip="<b>Autophagy</b>：細胞質抗原被包進 autophagosome → 進入 MHC II 路徑（內源抗原也能給 CD4 看）。" data-label="Autophagy"><text x="94" y="140" class="tr" style="font-size:12px">Autophagy</text></g>
<path d="M300 204V166H514V116" class="lv dash" marker-end="url(#mp-av)" style="stroke-width:1.5"/>
<g class="hot" data-tip="<b>Cross-presentation</b>：<b>DC</b> 把外源抗原放上 <b>MHC I</b> → 活化 CD8⁺ T（對抗不直接感染 DC 的病毒、腫瘤）。" data-label="Cross-presentation"><text x="318" y="160" class="tv" style="font-size:12px">Cross-presentation（DC）</text></g>
</svg>
