<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" role="img" aria-label="T 與 B 細胞在淋巴結的相遇：活化前 B 細胞表現 CXCR5 待在 follicle，T 細胞表現 CCR7 待在 T 區；B 細胞的 BCR 結合抗原後改表現 CCR7 與 EBI2，T 細胞被 DC 活化後改表現 CXCR5，兩者移到 B/T 交界相遇；B 細胞把同一抗原的 peptide 放在 MHC II 給 T 看，T 以 CD40L 與 IL-21 幫忙，T 變成 TFH；之後一部分 B 在 primary focus 變成 plasmablast，一部分進入 germinal center 做 somatic hypermutation、被 FDC 篩選、class switch，最後成為 plasma cell 與 memory B。">
<defs><marker id="tm-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker></defs>
<text x="20" y="22" class="th">A · 淋巴結裡的路線：先各自活化，再換 CHEMOKINE 受體到交界相遇</text>
<rect x="20" y="36" width="300" height="180" rx="60" class="bv" style="stroke:none;opacity:.4"/><text x="40" y="58" class="tb tv" style="font-size:13px">B 區（follicle）</text><rect x="440" y="36" width="300" height="180" rx="60" class="bw" style="stroke:none;opacity:.45"/><text x="720" y="58" text-anchor="end" class="tb" style="font-size:13px">T 區（paracortex）</text><rect x="318" y="36" width="124" height="180" rx="10" class="none" style="stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:4 4"/><text x="380" y="58" text-anchor="middle" class="tb" style="font-size:12px">B / T 交界</text>
<circle cx="44" cy="92" r="9" class="fk"/><text x="44" y="96" text-anchor="middle" class="tw tb" style="font-size:11px">1</text>
<g class="hot" data-tip="活化前：B 細胞表現 &lt;b&gt;CXCR5&lt;/b&gt;，被 FDC 分泌的 &lt;b&gt;CXCL13&lt;/b&gt; 留在 follicle。" data-label="活化前的 B"><circle cx="92" cy="100" r="20" class="bv" style="stroke-width:1.5"/><text x="92" y="105" text-anchor="middle" class="tb" style="font-size:13px">B</text><text x="120" y="96" class="tb" style="font-size:11.5px">CXCR5</text><text x="120" y="111" class="ts">← CXCL13（FDC 分泌）</text></g>
<circle cx="716" cy="92" r="9" class="fk"/><text x="716" y="96" text-anchor="middle" class="tw tb" style="font-size:11px">1</text>
<g class="hot" data-tip="活化前：T 細胞表現 &lt;b&gt;CCR7&lt;/b&gt;，被 &lt;b&gt;CCL21&lt;/b&gt; 留在 T 區。" data-label="活化前的 T"><circle cx="668" cy="100" r="20" class="bw" style="stroke-width:1.5"/><text x="668" y="105" text-anchor="middle" class="tb" style="font-size:13px">T</text><text x="640" y="96" text-anchor="end" class="tb" style="font-size:11.5px">CCR7</text><text x="640" y="111" text-anchor="end" class="ts">← CCL21</text></g>
<circle cx="44" cy="160" r="9" class="fk"/><text x="44" y="164" text-anchor="middle" class="tw tb" style="font-size:11px">2</text>
<text x="60" y="164" class="ts">BCR 抓到抗原、吞進去</text><text x="60" y="180" style="font-size:12px">→ <tspan class="tb">↑CCR7、EBI2</tspan></text>
<path d="M180 168C240 168 270 150 330 140" class="lv" marker-end="url(#tm-a)"/>
<circle cx="716" cy="160" r="9" class="fk"/><text x="716" y="164" text-anchor="middle" class="tw tb" style="font-size:11px">2</text>
<text x="700" y="164" text-anchor="end" class="ts">被 DC 活化（signal ①②③）</text><text x="700" y="180" text-anchor="end" style="font-size:12px">→ <tspan class="tb">↑CXCR5</tspan></text>
<path d="M580 168C520 168 490 150 430 140" class="ln" style="stroke:var(--warn);stroke-width:1.8" marker-end="url(#tm-a)"/>
<circle cx="346" cy="92" r="9" class="fk"/><text x="346" y="96" text-anchor="middle" class="tw tb" style="font-size:11px">3</text>
<g class="hot" data-tip="兩者移到 &lt;b&gt;B / T 交界&lt;/b&gt;與 interfollicular 區相遇，在 follicle 周邊聚集。" data-label="交界相遇"><circle cx="364" cy="140" r="18" class="bv" style="stroke-width:1.5"/><text x="364" y="145" text-anchor="middle" class="tb" style="font-size:13px">B</text><circle cx="398" cy="140" r="18" class="bw" style="stroke-width:1.5"/><text x="398" y="145" text-anchor="middle" class="tb" style="font-size:13px">T</text><text x="380" y="186" text-anchor="middle" class="tb" style="font-size:12px">相遇</text><text x="380" y="202" text-anchor="middle" class="ts">在 follicle 邊緣</text></g>
<path d="M20 236H740" class="lt"/>
<text x="20" y="256" class="th">B · 交界的那一下：同一個抗原，兩邊各看一半</text>
<rect x="30" y="276" width="96" height="104" rx="48" class="bv" style="stroke-width:1.5"/><text x="78" y="334" text-anchor="middle" class="tb" style="font-size:16px">B</text><rect x="334" y="276" width="96" height="104" rx="48" class="bw" style="stroke-width:1.5"/><text x="382" y="330" text-anchor="middle" class="tb" style="font-size:16px">TFH</text><text x="382" y="346" text-anchor="middle" class="ts">Bcl-6</text>
<g class="hot" data-tip="B 用 BCR 吞抗原 → 切成 peptide → 放上 &lt;b&gt;MHC II&lt;/b&gt;；TFH 的 TCR 認這個 peptide。所以 B 與 T 認的是&lt;b&gt;同一個抗原&lt;/b&gt;（B 看 epitope 原形，T 看切過的 peptide）。" data-label="pMHC II ↔ TCR"><path d="M126 298H138M318 298H334" class="ln" style="stroke-width:1.3"/><text x="142" y="302" class="tb" style="font-size:12px">pMHC II</text><path d="M206 298H250" class="ln" style="stroke-width:1.3"/><circle cx="228" cy="298" r="2.5" class="fk"/><text x="314" y="302" text-anchor="end" class="tb" style="font-size:12px">TCR</text></g>
<text x="452" y="302" class="ts">peptide 來自 B 抓到的同一抗原</text>
<g class="hot" data-tip="&lt;b&gt;CD40L（CD154）&lt;/b&gt;在 T 上、&lt;b&gt;CD40&lt;/b&gt; 在 B 上 → NF-κB → B 存活、增殖、class switch。CD40L 缺陷 = &lt;b&gt;X-linked hyper-IgM&lt;/b&gt;。" data-label="CD40 ↔ CD40L"><path d="M126 328H138M318 328H334" class="ln" style="stroke-width:1.3"/><text x="142" y="332" class="tb" style="font-size:12px">CD40</text><path d="M206 328H250" class="ln" style="stroke-width:1.3"/><circle cx="228" cy="328" r="2.5" class="fk"/><text x="314" y="332" text-anchor="end" class="tb" style="font-size:12px">CD40L</text></g>
<text x="452" y="332" class="ts">缺了 = X-linked hyper-IgM</text>
<g class="hot" data-tip="TFH 分泌 &lt;b&gt;IL-21&lt;/b&gt; → STAT3 → B 生長、germinal center、IgG switch；IL-4、IFN-γ、TGF-β 等 cytokine 決定 isotype（見 class switch 那張圖）。" data-label="IL-21R ↔ IL-21"><path d="M126 358H138M318 358H334" class="ln" style="stroke-width:1.3"/><text x="142" y="362" class="tb" style="font-size:12px">IL-21R</text><path d="M206 358H250" class="ln" style="stroke-width:1.3"/><circle cx="228" cy="358" r="2.5" class="fk"/><text x="314" y="362" text-anchor="end" class="tb" style="font-size:12px">IL-21</text></g>
<text x="452" y="362" class="ts">→ STAT3；IL-4、IFN-γ、TGF-β 決定換哪型</text>
<text x="452" y="384" style="font-size:12px">老師：cytokine 分子小、跑不遠 → 兩個細胞要<tspan class="tb">先貼在一起</tspan></text><text x="452" y="400" class="ts">（不能「牧童遙指杏花村」）</text>
<path d="M20 416H740" class="lt"/>
<text x="20" y="436" class="th">C · 之後兩條路</text>
<g class="hot" data-tip="一部分活化的 B 在 follicle 外形成 &lt;b&gt;primary focus&lt;/b&gt;，分化成 &lt;b&gt;plasmablast&lt;/b&gt;。" data-label="primary focus"><rect x="20" y="448" width="210" height="112" rx="10" class="bp"/><text x="34" y="470" class="tb" style="font-size:13px">primary focus</text><text x="34" y="490" style="font-size:12px">B 增殖 → <tspan class="tb">plasmablast</tspan></text><text x="34" y="508" class="ts">留在 follicle 外</text><text x="34" y="524" class="ts">先送出第一批抗體</text></g>
<rect x="260" y="448" width="480" height="112" rx="10" class="bg"/><text x="274" y="470" class="tb" style="font-size:13px">germinal center</text><text x="392" y="470" class="ts">回到 follicle，TFH 跟進來</text>
<g class="hot" data-tip="&lt;b&gt;Somatic hypermutation&lt;/b&gt;：AID 把 cytidine 變 uridine → V 區點突變。AID 由 &lt;b&gt;IL-4 + CD40&lt;/b&gt; 誘導。" data-label="SHM"><rect x="274" y="480" width="104" height="54" rx="7" class="bx"/><text x="282" y="497" class="tb" style="font-size:12px">SHM</text><text x="282" y="512" class="ts">AID：C → U</text><text x="282" y="526" class="ts">改 V 區</text></g>
<path d="M379 507H389" class="ln" style="stroke-width:1.2" marker-end="url(#tm-a)"/>
<g class="hot" data-tip="親和力由考官 &lt;b&gt;FDC&lt;/b&gt; 決定：搶得到抗原 → 表現 &lt;b&gt;Bcl-2（免死金牌）&lt;/b&gt;存活；搶不到 → 凋亡。germinal center 裡&lt;b&gt;有大量凋亡&lt;/b&gt;。" data-label="FDC 篩選"><rect x="390" y="480" width="104" height="54" rx="7" class="bx"/><text x="398" y="497" class="tb" style="font-size:12px">FDC 篩選</text><text x="398" y="512" class="ts">搶到抗原 → Bcl-2</text><text x="398" y="526" class="ts">搶不到 → 凋亡</text></g>
<path d="M495 507H505" class="ln" style="stroke-width:1.2" marker-end="url(#tm-a)"/>
<g class="hot" data-tip="&lt;b&gt;Class switch&lt;/b&gt;：switch region 之間 DNA 重組，只換 constant region。需要 T 細胞的 &lt;b&gt;CD40L + cytokine&lt;/b&gt;。" data-label="class switch"><rect x="506" y="480" width="104" height="54" rx="7" class="bx"/><text x="514" y="497" class="tb" style="font-size:12px">class switch</text><text x="514" y="512" class="ts">改 C 區、V 不變</text><text x="514" y="526" class="ts">需要 T 幫忙</text></g>
<path d="M611 507H621" class="ln" style="stroke-width:1.2" marker-end="url(#tm-a)"/>
<g class="hot" data-tip="高親和力、換過型的 &lt;b&gt;plasma cell&lt;/b&gt; 與 &lt;b&gt;memory B&lt;/b&gt; → 二次反應快、量大、IgG 為主。" data-label="產物"><rect x="622" y="480" width="104" height="54" rx="7" class="bx"/><text x="630" y="497" class="tb" style="font-size:12px">產物</text><text x="630" y="512" class="ts">plasma cell</text><text x="630" y="526" class="ts">memory B</text></g>
<path d="M442 535C442 552 326 552 326 537" class="ln dash" style="stroke-width:1" marker-end="url(#tm-a)"/>
<text x="460" y="552" class="ts" style="font-size:10.5px">反覆突變、再篩選 → affinity maturation</text>
<path d="M70 380V446" class="ln" style="stroke-width:1.3" marker-end="url(#tm-a)"/><path d="M110 372C200 406 300 410 320 446" class="ln" style="stroke-width:1.3" marker-end="url(#tm-a)"/>
</svg>
