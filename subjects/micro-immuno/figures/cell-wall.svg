<path d="M618 100H612" class="lt"/><g class="hot" data-tip="Core polysaccharide，含 KDO；同一菌種相同。" data-label="Core polysaccharide"><text x="624" y="104">Core</text><text x="660" y="104" class="ts">含 KDO</text></g>
<path d="M618 120H614" class="lt"/><g class="hot" data-tip="<b>內毒素（endotoxin）活性來源</b> → 發燒、休克、DIC。<br>LPS → LPS-binding protein → CD14 → <b>TLR4</b>。只有 G(−) 有 LPS。" data-label="Lipid A"><text x="624" y="124" class="tr tb">Lipid A</text><text x="624" y="140" class="ts">外膜外層</text></g>
<path d="M618 174H612" class="lt"/><g class="hot" data-tip="外膜與細胞膜之間的周質空間：薄層 PDG（只佔 5–10%）、<b>β-lactamase</b>、protease 等水解酶；Braun lipoprotein 把外膜固定在 PDG 上。" data-label="Periplasmic space"><text x="624" y="178">Periplasm</text><text x="624" y="194" class="ts">薄 PDG、β-lactamase</text></g>
<path d="M618 223H612" class="lt"/><g class="hot" data-tip="與 G(+) 相同：磷脂雙層、無固醇；ATP 產生處。" data-label="細胞膜 cell membrane"><text x="624" y="227">細胞膜</text></g>
