<path d="M238 56H200" class="lt"/><g class="hot" data-tip="G(+) 獨有、帶負電、具抗原特異性。<br>Lipoteichoic acid（LTA）錨在細胞膜上 → 被 <b>TLR2:TLR6</b> 辨識；wall teichoic acid 接在 PDG 上。" data-label="Teichoic acid"><text x="244" y="60">Teichoic acid</text><text x="244" y="76" class="ts">磷壁酸（G+ 獨有）</text></g>
<path d="M238 138H231" class="lt"/><g class="hot" data-tip="NAG–NAM 交替，NAM 上接 tetrapeptide；第 3 位（L-Lys / DAP）與第 4 位 D-Ala 交叉連結（transpeptidation，PBPs 催化）。<br>→ β-lactam、vancomycin 的作用點；lysozyme 切 NAG–NAM 的 β-1,4 鍵。" data-label="Peptidoglycan"><text x="244" y="142">Peptidoglycan</text><text x="244" y="158" class="ts">厚、多層</text></g>
<path d="M238 223H231" class="lt"/><g class="hot" data-tip="所有細菌都有。磷脂雙層、<b>無固醇</b>（以 hopanoids 代替；Mycoplasma 例外含 sterol）。<br>電子傳遞鏈與 ATP 產生處。" data-label="細胞膜 cell membrane"><text x="244" y="227">細胞膜</text><text x="244" y="243" class="ts">磷脂雙層、無固醇</text></g>
