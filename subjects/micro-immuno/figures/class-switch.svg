<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Isotype class switch：switch region 之間的 DNA 重組把中間片段切成環狀移除，讓同一個 VDJ 接上新的 constant region；IL-4 誘導 IgG1 與 IgE，IFN-γ 誘導 IgG3 與 IgG2a，TGF-β 誘導 IgG2b 與 IgA">
<defs><marker id="cs-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker>
<marker id="cs-av" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fv"/></marker>
<marker id="cs-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fr"/></marker>
<marker id="cs-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fg"/></marker></defs>
<text x="20" y="22" class="th">A · 重鏈恆定區（小鼠）與 SWITCH RECOMBINATION</text>
<path d="M20 80H560" class="lt"/><rect x="20" y="70" width="56" height="20" rx="4" class="bv"/><text x="48" y="84" text-anchor="middle" class="tb" style="font-size:11px">VDJ</text><rect x="90" y="74" width="14" height="12" rx="6" class="none" style="stroke:var(--ink-2);stroke-dasharray:2 2"/><rect x="106" y="70" width="36" height="20" rx="4" class="bv"/><text x="124" y="84" text-anchor="middle" style="font-size:11px">Cμ</text><rect x="152" y="70" width="36" height="20" rx="4" class="bp"/><text x="170" y="84" text-anchor="middle" style="font-size:11px">Cδ</text><rect x="198" y="74" width="14" height="12" rx="6" class="none" style="stroke:var(--ink-2);stroke-dasharray:2 2"/><rect x="214" y="70" width="36" height="20" rx="4" class="bg"/><text x="232" y="84" text-anchor="middle" style="font-size:11px">Cγ3</text><rect x="260" y="74" width="14" height="12" rx="6" class="none" style="stroke:var(--ink-2);stroke-dasharray:2 2"/><rect x="276" y="70" width="36" height="20" rx="4" class="bg"/><text x="294" y="84" text-anchor="middle" style="font-size:11px">Cγ1</text><rect x="322" y="74" width="14" height="12" rx="6" class="none" style="stroke:var(--ink-2);stroke-dasharray:2 2"/><rect x="338" y="70" width="36" height="20" rx="4" class="bg"/><text x="356" y="84" text-anchor="middle" style="font-size:11px">Cγ2b</text><rect x="384" y="74" width="14" height="12" rx="6" class="none" style="stroke:var(--ink-2);stroke-dasharray:2 2"/><rect x="400" y="70" width="36" height="20" rx="4" class="bg"/><text x="418" y="84" text-anchor="middle" style="font-size:11px">Cγ2a</text><rect x="446" y="74" width="14" height="12" rx="6" class="none" style="stroke:var(--ink-2);stroke-dasharray:2 2"/><rect x="462" y="70" width="36" height="20" rx="4" class="br"/><text x="480" y="84" text-anchor="middle" style="font-size:11px">Cε</text><rect x="508" y="74" width="14" height="12" rx="6" class="none" style="stroke:var(--ink-2);stroke-dasharray:2 2"/><rect x="524" y="70" width="36" height="20" rx="4" class="bw"/><text x="542" y="84" text-anchor="middle" style="font-size:11px">Cα</text>
<text x="20" y="112" class="ts">↑ DNA（還沒 switch：表現 IgM + IgD）</text>
<path d="M97 70C97 36 453 36 453 70" class="lr dash" style="stroke-width:1.6"/>
<rect x="191.0" y="30" width="168" height="20" class="fc"/>
<g class="hot" data-tip="兩個 <b>switch region</b>（Sμ 與 Sε）之間發生 DNA 重組，中間的 DNA 被切成<b>環狀</b>丟掉 → 同一個 VDJ 接上 Cε → IgE。需要 <b>AID</b>（C → U）；是 <b>DNA 層級</b>、不可逆。" data-label="Class switch recombination"><text x="275.0" y="44" text-anchor="middle" class="tr" style="font-size:12px">例：IL-4 → switch 到 ε</text></g>
<circle cx="660" cy="80" r="40" class="none" style="stroke:var(--ink-3);stroke-dasharray:3 3"/><text x="660" y="76" text-anchor="middle" class="ts">Cμ…Cγ2a</text><text x="660" y="92" text-anchor="middle" class="ts">環狀切除</text>
<path d="M290 104V124" class="ln" marker-end="url(#cs-a)"/>
<path d="M20 144H250" class="lt"/><rect x="20" y="134" width="56" height="20" rx="4" class="bv"/><text x="48" y="148" text-anchor="middle" class="tb" style="font-size:11px">VDJ</text><rect x="90" y="138" width="14" height="12" rx="6" class="none" style="stroke:var(--ink-2);stroke-dasharray:2 2"/><rect x="106" y="134" width="36" height="20" rx="4" class="br"/><text x="124" y="148" text-anchor="middle" style="font-size:11px">Cε</text><rect x="152" y="138" width="14" height="12" rx="6" class="none" style="stroke:var(--ink-2);stroke-dasharray:2 2"/><rect x="168" y="134" width="36" height="20" rx="4" class="bw"/><text x="186" y="148" text-anchor="middle" style="font-size:11px">Cα</text>
<text x="264" y="148" class="tb" style="font-size:12px">→ IgE</text><text x="310" y="148" class="ts">V 區不變 = 抗原專一性不變，只換 constant region</text>
<text x="20" y="184" class="th">需要什麼</text><text x="110" y="184" class="ts" style="fill:var(--ink-2)">TFH 的 <tspan class="tb" style="fill:var(--ink)">CD40L ↔ B 的 CD40</tspan> + cytokine；AID（germinal center）</text>
<text x="20" y="204" class="th">IgM 與 IgD</text><text x="110" y="204" class="ts" style="fill:var(--ink-2)">Cδ 前沒有 switch region → 兩者共表現靠 <tspan class="tb" style="fill:var(--ink)">RNA splicing</tspan>（membrane / secreted 也是 RNA 層級）</text>
<text x="20" y="224" class="th">缺 CD40L</text><text x="110" y="224" class="ts" style="fill:var(--ink-2)">X-linked hyper-IgM：無法 switch → IgM 正常或高、IgG/IgA/IgE 低；CD4 T 數目正常</text>
<path d="M20 250H740" class="lt"/><text x="20" y="272" class="th">B · CYTOKINE → ISOTYPE（共筆表，小鼠為主）</text>
<text x="20" y="298" class="tb" style="font-size:13px">IL-4</text>
<rect x="20" y="308" width="46" height="22" rx="11" class="bg"/><text x="43" y="323" text-anchor="middle" style="font-size:11px">IgG1</text>
<rect x="72" y="308" width="46" height="22" rx="11" class="br"/><text x="95" y="323" text-anchor="middle" style="font-size:11px;font-weight:700">IgE</text>
<text x="150" y="298" class="tb" style="font-size:13px">IFN-γ</text>
<rect x="150" y="308" width="46" height="22" rx="11" class="bg"/><text x="173" y="323" text-anchor="middle" style="font-size:11px">IgG3</text>
<rect x="202" y="308" width="46" height="22" rx="11" class="bg"/><text x="225" y="323" text-anchor="middle" style="font-size:11px">IgG2a</text>
<text x="280" y="298" class="tb" style="font-size:13px">TGF-β</text>
<rect x="280" y="308" width="46" height="22" rx="11" class="bg"/><text x="303" y="323" text-anchor="middle" style="font-size:11px">IgG2b</text>
<rect x="332" y="308" width="46" height="22" rx="11" class="bw"/><text x="355" y="323" text-anchor="middle" style="font-size:11px;font-weight:700">IgA</text>
<text x="410" y="298" class="tb" style="font-size:13px">IL-21</text>
<rect x="410" y="308" width="46" height="22" rx="11" class="bg"/><text x="433" y="323" text-anchor="middle" style="font-size:11px">IgG3</text>
<rect x="462" y="308" width="46" height="22" rx="11" class="bg"/><text x="485" y="323" text-anchor="middle" style="font-size:11px">IgG1</text>
<rect x="514" y="308" width="46" height="22" rx="11" class="bw"/><text x="537" y="323" text-anchor="middle" style="font-size:11px">IgA</text>
<text x="586" y="298" class="tb" style="font-size:13px">IL-5</text>
<rect x="586" y="308" width="46" height="22" rx="11" class="bg"/><text x="609" y="323" text-anchor="middle" style="font-size:11px">IgG1</text>
<rect x="638" y="308" width="46" height="22" rx="11" class="bw"/><text x="661" y="323" text-anchor="middle" style="font-size:11px">IgA</text>
</svg>
