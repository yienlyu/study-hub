<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-label="可抑制型 operon：終產物不足時 repressor 沒有活性、基因持續轉錄；終產物累積時當作 corepressor 與 repressor 結合，複合體結合 operator 擋住 RNA polymerase，轉錄停止">
<defs><marker id="rp-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker><marker id="rp-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fr"/></marker><marker id="rp-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fg"/></marker></defs>
<text x="20" y="28" class="tb">① 終產物不足 → 基因<tspan class="tg" style="fill:var(--good)">開</tspan></text>
<text x="250" y="28" class="ts">預設狀態（default ON）</text>
<path d="M20 112H760" class="ln" style="stroke-width:2"/><g class="hot" data-tip="<b>調節基因</b>：位置不一定在 operon 旁邊，自己有 promoter，<b>持續表現</b>，產生 repressor 蛋白。" data-label="調節基因 R"><rect x="20" y="99" width="70" height="26" rx="4" class="bp"/><text x="55.0" y="116.5" text-anchor="middle" class="ts">調節基因 R</text></g><path d="M96 112H150" class="lt dash" style="stroke-width:2"/><g class="hot" data-tip="<b>Promoter</b>：RNA polymerase 結合、開始轉錄的位置。" data-label="Promoter"><rect x="160" y="99" width="48" height="26" rx="4" class="bp"/><text x="184.0" y="116.5" text-anchor="middle" class="tb">P</text></g><g class="hot" data-tip="<b>Operator</b>：repressor 結合的 DNA 開關，位在 promoter 與結構基因之間；被佔住時 RNA polymerase 無法往下走。" data-label="Operator"><rect x="208" y="99" width="42" height="26" rx="4" class="bw"/><text x="229.0" y="116.5" text-anchor="middle" class="tb">O</text></g><rect x="250" y="99" width="90" height="26" rx="4" class="bx"/><text x="295.0" y="116.5" text-anchor="middle" class="ts">結構基因 A</text><rect x="340" y="99" width="90" height="26" rx="4" class="bx"/><text x="385.0" y="116.5" text-anchor="middle" class="ts">結構基因 B</text><rect x="430" y="99" width="90" height="26" rx="4" class="bx"/><text x="475.0" y="116.5" text-anchor="middle" class="ts">結構基因 C</text>
<path d="M31 180V162q0 -10 10 -10h4l7 3l7 -3h4q10 0 10 10V180q-12 6 -24 6t-24 -6z" class="bx dash"/>
<path d="M55 126V150" class="ln" marker-end="url(#rp-a)"/>
<g class="hot" data-tip="基因產物是 <b>aporepressor</b>：單獨存在時<b>沒有活性</b>，結合不上 operator。" data-label="aporepressor"><text x="92" y="162" class="ts">aporepressor</text><text x="92" y="177" class="ts">（無活性，接不上 O）</text></g>
<ellipse cx="184" cy="82" rx="30" ry="17" class="bg"/><text x="184" y="86" text-anchor="middle" class="ts" style="fill:var(--good);font-weight:650">RNA pol</text>
<path d="M216 82H515" class="lg" marker-end="url(#rp-ag)"/>
<text x="365" y="74" text-anchor="middle" class="ts" style="fill:var(--good)">一路轉錄下去</text>
<path d="M252 146q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0q2.0 -4 4.0 0q2.0 4 4.0 0" class="lv" style="stroke-width:1.6"/>
<g class="hot" data-tip="A、B、C 一起轉錄成<b>一條 polycistronic mRNA</b>，再轉譯成合成路徑上的各個酵素。" data-label="polycistronic mRNA"><text x="386" y="168" text-anchor="middle" class="ts" style="fill:var(--violet)">polycistronic mRNA → 酵素 A、B、C</text></g>
<path d="M530 146H588" class="ln" marker-end="url(#rp-a)"/>
<rect x="592" y="130" width="168" height="32" rx="16" class="bx"/><text x="676.0" y="150.5" text-anchor="middle" class="ts">合成終產物（如 Trp）</text>
<text x="676" y="180" text-anchor="middle" class="ts">濃度還低，不足以當 corepressor</text>
<path d="M20 216H760" class="lt"/>
<text x="20" y="250" class="tb">② 終產物累積 → 基因<tspan class="tr">關</tspan></text>
<text x="250" y="250" class="ts">回饋抑制自己的合成（repression）</text>
<path d="M20 334H760" class="ln" style="stroke-width:2"/><g class="hot" data-tip="<b>調節基因</b>：位置不一定在 operon 旁邊，自己有 promoter，<b>持續表現</b>，產生 repressor 蛋白。" data-label="調節基因 R"><rect x="20" y="321" width="70" height="26" rx="4" class="bp"/><text x="55.0" y="338.5" text-anchor="middle" class="ts">調節基因 R</text></g><path d="M96 334H150" class="lt dash" style="stroke-width:2"/><g class="hot" data-tip="<b>Promoter</b>：RNA polymerase 結合、開始轉錄的位置。" data-label="Promoter"><rect x="160" y="321" width="48" height="26" rx="4" class="bp"/><text x="184.0" y="338.5" text-anchor="middle" class="tb">P</text></g><g class="hot" data-tip="<b>Operator</b>：repressor 結合的 DNA 開關，位在 promoter 與結構基因之間；被佔住時 RNA polymerase 無法往下走。" data-label="Operator"><rect x="208" y="321" width="42" height="26" rx="4" class="bw"/><text x="229.0" y="338.5" text-anchor="middle" class="tb">O</text></g><rect x="250" y="321" width="90" height="26" rx="4" class="bx"/><text x="295.0" y="338.5" text-anchor="middle" class="ts">結構基因 A</text><rect x="340" y="321" width="90" height="26" rx="4" class="bx"/><text x="385.0" y="338.5" text-anchor="middle" class="ts">結構基因 B</text><rect x="430" y="321" width="90" height="26" rx="4" class="bx"/><text x="475.0" y="338.5" text-anchor="middle" class="ts">結構基因 C</text>
<rect x="592" y="268" width="168" height="32" rx="16" class="br"/><text x="676.0" y="288.5" text-anchor="middle" class="ts">終產物大量累積</text>
<polygon points="605,312 619,312 612,323" class="fr"/>
<polygon points="625,316 639,316 632,327" class="fr"/>
<polygon points="645,310 659,310 652,321" class="fr"/>
<g class="hot" data-tip="<b>終產物本身就是 corepressor</b>（例：Trp、His、Arg 等胺基酸合成路徑）。" data-label="corepressor"><text x="676" y="323" class="ts tr">= corepressor</text></g>
<path d="M590 276Q420 256 244 274" class="lr dash" marker-end="url(#rp-ar)"/>
<path d="M205 312V292q0 -8 8 -8h6l6 8l6 -8h6q8 0 8 8V312z" class="bv"/>
<polygon points="222,280 236,280 229,291" class="fr"/>
<path d="M229 313V319" class="lv" style="stroke-width:2.4"/>
<g class="hot" data-tip="<b>Corepressor + aporepressor → 有活性的 repressor</b>，複合體結合在 operator 上。<br>考點：是<b>複合體</b>結合 operator，corepressor 不會自己去結合 operator。" data-label="corepressor–repressor 複合體"><text x="262" y="284" class="ts" style="fill:var(--violet);font-weight:650">corepressor–repressor</text><text x="262" y="298" class="ts" style="fill:var(--violet)">複合體 → 結合 operator</text></g>
<ellipse cx="130" cy="304" rx="30" ry="17" class="bg"/><text x="130" y="308" text-anchor="middle" class="ts" style="fill:var(--good);font-weight:650">RNA pol</text>
<path d="M163 304H190" class="lr" style="stroke-width:2"/>
<path d="M168 294l14 20M182 294l-14 20" class="lr" style="stroke-width:2.4"/>
<text x="130" y="278" text-anchor="middle" class="ts tr">被擋住，無法轉錄</text>
<path d="M31 402V384q0 -10 10 -10h4l7 3l7 -3h4q10 0 10 10V402q-12 6 -24 6t-24 -6z" class="bx dash"/>
<path d="M55 348V372" class="ln" marker-end="url(#rp-a)"/>
<text x="92" y="392" class="ts">aporepressor 一直有在做</text>
<text x="386" y="374" text-anchor="middle" class="ts">沒有 mRNA → 不再做酵素 → 產物不再增加</text>
<path d="M20 424H760" class="lt"/>
<text x="20" y="448" class="th">INDUCIBLE vs REPRESSIBLE</text>
<text x="20" y="470" class="ts tb"></text>
<text x="170" y="470" class="ts tb">Inducible（如 lac）</text>
<text x="470" y="470" class="ts tb">Repressible（如 trp）</text>
<text x="20" y="487" class="ts tm">預設狀態</text>
<text x="170" y="487" class="ts">關（OFF）</text>
<text x="470" y="487" class="ts">開（ON）</text>
<text x="20" y="504" class="ts tm">repressor 單獨時</text>
<text x="170" y="504" class="ts">有活性，結合 operator</text>
<text x="470" y="504" class="ts">無活性（aporepressor）</text>
<text x="20" y="521" class="ts tm">小分子的角色</text>
<text x="170" y="521" class="ts">inducer 讓 repressor 脫離 → 開</text>
<text x="470" y="521" class="ts">corepressor 讓 repressor 結合 → 關</text>
<text x="20" y="538" class="ts tm">常見於</text>
<text x="170" y="538" class="ts">分解代謝（有受質才開）</text>
<text x="470" y="538" class="ts">合成代謝（產物夠了就關）</text>
</svg>