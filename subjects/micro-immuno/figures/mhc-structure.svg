<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="MHC class I 與 class II 結構比較：MHC I 由 α1、α2 組成兩端封閉的槽，放 8 到 10 個胺基酸；MHC II 由 α1、β1 組成兩端開放的槽，放 13 到 18 個胺基酸">
<defs><marker id="ms-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker>
<marker id="ms-av" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fv"/></marker>
<marker id="ms-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fr"/></marker>
<marker id="ms-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fg"/></marker></defs>
<rect x="20" y="196" width="720" height="22" class="fp"/><text x="24" y="211" class="th">細胞膜</text>
<text x="190" y="24" text-anchor="middle" class="tb" style="font-size:15px">MHC class I</text><text x="190" y="42" text-anchor="middle" class="ts">α 鏈 + β2-microglobulin</text>
<rect x="128" y="96" width="58" height="48" rx="16" class="bv"/><text x="157.0" y="125.0" text-anchor="middle" class="tb" style="font-size:12.5px">α1</text><rect x="190" y="96" width="58" height="48" rx="16" class="bv"/><text x="219.0" y="125.0" text-anchor="middle" class="tb" style="font-size:12.5px">α2</text>
<rect x="150" y="148" width="52" height="46" rx="16" class="bv"/><text x="176.0" y="176.0" text-anchor="middle" class="tb" style="font-size:12.5px">α3</text>
<rect x="208" y="152" width="46" height="42" rx="16" class="bg"/><text x="231.0" y="178.0" text-anchor="middle" class="tb" style="font-size:12.5px">β2m</text>
<path d="M176 194V222q0 8 -6 12" class="lv" style="stroke-width:3"/>
<path d="M126 100V78M250 100V78" class="lv" style="stroke-width:5;stroke-linecap:round"/>
<rect x="140" y="80" width="96" height="12" rx="6" class="bw"/>
<g class="hot" data-tip="MHC I 結合槽由 <b>α1 + α2</b> 組成、<b>兩端封閉</b> → 只能放 <b>8–10 aa</b>，兩端埋在槽裡（anchor 常為疏水 C 端）、中間拱起。" data-label="MHC I 的 peptide"><text x="264" y="90" class="tb" style="fill:var(--warn)">peptide 8–10 aa</text><text x="264" y="106" class="ts nou">槽兩端封閉</text></g>
<g class="hot" data-tip="CD8（co-receptor）結合 MHC I 的 <b>α3</b> domain，帶 Lck 參與訊號。" data-label="CD8 結合 α3"><text x="66" y="176">CD8</text></g>
<path d="M96 172H146" class="ln" marker-end="url(#ms-a)"/>
<g class="hot" data-tip="<b>β2-microglobulin</b> 不是 MHC 基因編碼（第 15 號染色體），沒有跨膜區。" data-label="β2-microglobulin"><text x="262" y="172" class="ts" style="fill:var(--good)">非 MHC 基因</text></g>
<text x="528" y="24" text-anchor="middle" class="tb" style="font-size:15px">MHC class II</text><text x="528" y="42" text-anchor="middle" class="ts">α 鏈 + β 鏈（都由 MHC 編碼）</text>
<rect x="466" y="96" width="58" height="48" rx="16" class="bv"/><text x="495.0" y="125.0" text-anchor="middle" class="tb" style="font-size:12.5px">α1</text><rect x="532" y="96" width="58" height="48" rx="16" class="br"/><text x="561.0" y="125.0" text-anchor="middle" class="tb" style="font-size:12.5px">β1</text>
<rect x="472" y="148" width="50" height="46" rx="16" class="bv"/><text x="497.0" y="176.0" text-anchor="middle" class="tb" style="font-size:12.5px">α2</text><rect x="534" y="148" width="50" height="46" rx="16" class="br"/><text x="559.0" y="176.0" text-anchor="middle" class="tb" style="font-size:12.5px">β2</text>
<path d="M497 194V222q0 8 -6 12" class="lv" style="stroke-width:3"/><path d="M559 194V222q0 8 6 12" class="lr" style="stroke-width:3"/>
<path d="M464 100V84M592 100V84" class="lv" style="stroke-width:3;stroke-linecap:round;opacity:.5"/>
<rect x="426" y="80" width="204" height="12" rx="6" class="bw"/>
<g class="hot" data-tip="MHC II 結合槽由 <b>α1 + β1</b> 組成、<b>兩端開放</b> → 放 <b>13–18 aa</b>（12 到 >20），peptide 可以伸出槽外；H-bond 分布在整段。" data-label="MHC II 的 peptide"><text x="638" y="90" class="tb" style="fill:var(--warn)">peptide 13–18 aa</text><text x="638" y="106" class="ts nou">槽兩端開放、可伸出</text></g>
<g class="hot" data-tip="CD4（co-receptor）結合 MHC II 的 <b>β2</b> domain。" data-label="CD4 結合 β2"><text x="644" y="176">CD4</text></g>
<path d="M638 172H588" class="ln" marker-end="url(#ms-a)"/>
<path d="M372 30V238" class="lt dash"/>
<path d="M20 247H740" class="lt"/>
<text x="20" y="262" class="th">Peptide 來源</text><text x="120" y="262" class="ts" style="fill:var(--ink)">Endogenous（細胞質：病毒、胞內菌）</text><text x="420" y="262" class="ts" style="fill:var(--ink)">Exogenous（endocytosis、phagocytosis）</text>
<path d="M20 271H740" class="lt"/>
<text x="20" y="286" class="th">給誰看</text><text x="120" y="286" class="ts" style="fill:var(--ink)">CD8⁺ Tc</text><text x="420" y="286" class="ts" style="fill:var(--ink)">CD4⁺ TH</text>
<path d="M20 295H740" class="lt"/>
<text x="20" y="310" class="th">表現在</text><text x="120" y="310" class="ts" style="fill:var(--ink)">所有有核細胞（紅血球沒有）</text><text x="420" y="310" class="ts" style="fill:var(--ink)">APC（DC、macrophage、B）、胸腺上皮</text>
<path d="M20 319H740" class="lt"/>
<text x="20" y="334" class="th">人類基因</text><text x="120" y="334" class="ts" style="fill:var(--ink)">HLA-A、-B、-C</text><text x="420" y="334" class="ts" style="fill:var(--ink)">HLA-DP、-DQ、-DR</text>
</svg>
