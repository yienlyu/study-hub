<path d="M660 222Q690 236 704 256" class="ln" marker-end="url(#ex-a)"/>
<rect x="717" y="259" width="14" height="6" rx="3" class="fr" transform="rotate(20 724 262)"/>
<rect x="733" y="269" width="14" height="6" rx="3" class="fr" transform="rotate(-30 740 272)"/>
<rect x="711" y="277" width="14" height="6" rx="3" class="fr" transform="rotate(60 718 280)"/>
<rect x="729" y="251" width="14" height="6" rx="3" class="fr" transform="rotate(10 736 254)"/>
<text x="700" y="298" text-anchor="middle" class="ts">感染處</text>
<g transform="translate(18 236)"><circle cx="6" cy="0" r="3" class="fr"/><text x="16" y="4" class="ts">醣類（selectin 的配體）</text><circle cx="6" cy="20" r="3.4" class="fv"/><text x="16" y="24" class="ts">chemokine</text><path d="M4 34v8M8 34v8" class="lg" style="stroke-width:1.6"/><text x="16" y="44" class="ts">integrin ↔ ICAM</text></g>
<text x="250" y="262" class="ts">口訣 <tspan class="tb" style="fill:var(--ink)">S → C → I</tspan>：Selectin → Chemokine → Integrin（考古選項順序常被打亂）</text>
</svg>
