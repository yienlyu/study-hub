<rect x="225" y="75.5" width="22" height="9" rx="4.5" class="fk" transform="rotate(0 236 80)"/>
<text x="236" y="64" text-anchor="middle" class="ts">intimin–Tir</text>
<text x="168" y="246" class="ts" style="fill:var(--ink)">intimin–Tir 黏附</text>
<text x="168" y="264" class="ts" style="fill:var(--ink-2)">微絨毛被抹平（A/E）</text>
<text x="168" y="282" class="ts" style="fill:var(--ink-2)">沒有 Shiga toxin</text>
<path d="M160 8V300" class="lt dash"/>
<g class="hot" data-tip="<b>EHEC / STEC（O157:H7）</b>：與 EPEC 一樣 A/E lesion，另外分泌 <b>Shiga toxin（Stx1/2 = verotoxin）</b>：B 次單元接 <b>Gb3</b>，A 次單元切 <b>60S（28S）rRNA</b> → 停止蛋白質合成；入血到腎 → <b>HUS</b>。常見來源：沒煮熟的牛肉。無發燒。" data-label="EHEC"><text x="316" y="24" class="tb" style="font-size:15px">EHEC</text></g>
<text x="316" y="42" class="ts">出血性結腸炎、HUS</text>
<rect x="402" y="12" width="44" height="18" rx="9" class="br"/><text x="424" y="25" text-anchor="middle" class="ts" style="fill:var(--safranin);font-weight:600">血便</text>
<rect x="336" y="100" width="96" height="96" rx="8" class="bp"/><ellipse cx="384" cy="170" rx="16" ry="11" class="fm" opacity=".7"/><path d="M340 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M346 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M352 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M358 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M364 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M406 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M412 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M418 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M424 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/>
<path d="M366 100Q384 80 402 100" class="bp" style="stroke:none"/><path d="M364 100Q384 78 404 100" class="ln" style="stroke-width:1.4;stroke:var(--rule-strong)"/>
