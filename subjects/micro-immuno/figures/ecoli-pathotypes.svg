<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" role="img" aria-label="致病性大腸桿菌五型在腸細胞上的作用：ETEC 以 LT、ST 毒素造成水瀉；EPEC 以 intimin 與 Tir 造成 attaching and effacing；EHEC 另分泌 Shiga toxin 造成血便與 HUS；EIEC 侵入上皮；EAEC 疊磚式聚集">
<defs><marker id="ec-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker>
<marker id="ec-av" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fv"/></marker>
<marker id="ec-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fr"/></marker>
<marker id="ec-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fg"/></marker></defs>
<g class="hot" data-tip="<b>ETEC</b>：CFA 黏附，<b>不破壞、不侵入</b>腸細胞。<b>LT</b>（heat-labile，≈ cholera toxin）→ <b>cAMP↑</b>；<b>ST</b>（heat-stable）→ <b>cGMP↑</b> → Cl⁻、水分泌 → 水瀉，<b>不發燒</b>。" data-label="ETEC"><text x="20" y="24" class="tb" style="font-size:15px">ETEC</text></g>
<text x="20" y="42" class="ts">旅行者腹瀉</text>
<rect x="106" y="12" width="44" height="18" rx="9" class="bp"/><text x="128" y="25" text-anchor="middle" class="ts" style="fill:var(--ink-2);font-weight:600">水瀉</text>
<rect x="40" y="100" width="96" height="96" rx="8" class="bp"/><ellipse cx="88" cy="170" rx="16" ry="11" class="fm" opacity=".7"/><path d="M44 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M50 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M56 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M62 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M68 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M74 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M80 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M86 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M92 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M98 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M104 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M110 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M116 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M122 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/><path d="M128 100V90" class="ln" style="stroke-width:2;stroke-linecap:round;stroke:var(--rule-strong)"/>
<rect x="57" y="69.5" width="22" height="9" rx="4.5" class="fk" transform="rotate(-8 68 74)"/><rect x="95" y="65.5" width="22" height="9" rx="4.5" class="fk" transform="rotate(6 106 70)"/>
<path d="M68 79V88M106 75V88" class="ln" style="stroke-width:1"/>
<circle cx="82" cy="94" r="3.2" class="fv"/>
<circle cx="92" cy="106" r="3.2" class="fv"/>
<circle cx="102" cy="96" r="3.2" class="fw"/>
<circle cx="74" cy="110" r="3.2" class="fw"/>
<text x="72" y="140" text-anchor="middle" class="tb" style="font-size:12px">cAMP↑ cGMP↑</text>
