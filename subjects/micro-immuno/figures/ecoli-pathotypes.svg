<text x="344" y="214" class="ts" style="fill:var(--safranin)">Stx</text>
<text x="316" y="246" class="ts" style="fill:var(--ink)">A/E + Shiga toxin</text>
<text x="316" y="264" class="ts" style="fill:var(--ink-2)">Stx → Gb3 → 切 60S</text>
<text x="316" y="282" class="ts" style="fill:var(--ink-2)">入血 → 腎：HUS</text>
<path d="M308 8V300" class="lt dash"/>
