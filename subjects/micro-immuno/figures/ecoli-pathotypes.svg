<text x="20" y="246" class="ts" style="fill:var(--ink)">LT → cAMP↑</text>
<text x="20" y="264" class="ts" style="fill:var(--ink-2)">ST → cGMP↑</text>
<text x="20" y="282" class="ts" style="fill:var(--ink-2)">不破壞腸細胞、不發燒</text>
<g class="hot" data-tip="<b>EPEC</b>：BFP、<b>intimin–Tir</b> → attaching &amp; effacing（微絨毛消失、長出 pedestal）；<b>沒有 Shiga toxin</b>，不侵入。" data-label="EPEC"><text x="168" y="24" class="tb" style="font-size:15px">EPEC</text></g>
<text x="168" y="42" class="ts">嬰兒水瀉</text>
