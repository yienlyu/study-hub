<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 689" role="img" aria-label="CD4 TH 亞群分化詳細版：IL-12 誘導 TH1（T-bet），分泌 IFN-γ 活化 macrophage 對付胞內病原；IL-4 誘導 TH2（GATA3），IL-4 換 IgE、IL-5 活化 eosinophil、IL-13 增加黏液與平滑肌收縮，對付寄生蟲；IL-6 誘導 TFH（Bcl-6），IL-21 與 CD40L 幫 B 細胞；TGF-β 加 IL-6 加 IL-23 誘導 TH17（RORγt），IL-17 招募 neutrophil 對付胞外菌與真菌；TGF-β 加 IL-2 誘導 pTreg（FoxP3），TGF-β 與 IL-10 抑制免疫。下方為亞群互相抑制與 ILC 對照。">
<defs><marker id="tf-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker><marker id="tf-i" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M5,0 V10" class="ln" style="stroke-width:2.4"/></marker></defs>
<text x="16" y="20" class="th">SIGNAL ③ 誘導</text><text x="268" y="20" class="th">亞群 · 轉錄因子</text><text x="400" y="20" class="th">分泌 → 作用</text><text x="742" y="20" class="th">被增強的細胞</text><text x="840" y="20" class="th">對付 · KO</text>
<rect x="260" y="34" width="772" height="84" rx="10" class="bv" style="stroke:none;opacity:.45"/>
<text x="112" y="63" class="tb" style="font-size:13px">IL-12 ⭐</text>
<text x="112" y="78" class="ts">由 APC 分泌</text>
<text x="112" y="95" class="ts">＋ IFN-γ</text>
<path d="M86 252 C98 252 90 76 106 76" class="ln" style="stroke-width:1.2;stroke:var(--violet)"/>
<g class="hot" data-tip="&lt;b&gt;IL-12&lt;/b&gt;（APC 分泌，考 4 次）＋ IFN-γ → &lt;b&gt;T-bet&lt;/b&gt; → TH1 → &lt;b&gt;IFN-γ&lt;/b&gt; + CD40L 活化 M1 macrophage（NO、O₂⁻、IL-12 正回饋）。陷阱：IL-12 不是 TH2 分泌的。" data-label="TH1"><rect x="268" y="54" width="112" height="44" rx="22" class="bv" style="stroke-width:1.6"/><text x="284" y="81" class="tb" style="font-size:15px">TH1</text></g>
<text x="368" y="81" text-anchor="end" class="ts" style="fill:var(--ink-2)">T-bet</text>
<path d="M380 76H390" class="lt"/>
<text x="400" y="63" class="tb" style="font-size:12px">IFN-γ</text>
<text x="458" y="63" style="font-size:12px">活化 macrophage → M1（NO、O₂⁻、↑MHC、B7）</text>
<text x="400" y="80" class="tb" style="font-size:12px">CD40L</text>
<text x="458" y="80" style="font-size:12px">接 macrophage 的 CD40，加強活化</text>
<text x="400" y="97" class="tb" style="font-size:12px">IFN-γ</text>
<text x="458" y="97" style="font-size:12px">B 換 IgG3、IgG2a（小鼠）；活化 NK</text>
<text x="742" y="72" class="tb" style="font-size:12px">macrophage</text>
<text x="742" y="88" class="" style="font-size:12px">（M1）</text>
<text x="840" y="54" class="" style="font-size:12px">胞內病原：</text>
<text x="840" y="72" class="" style="font-size:12px">mycobacteria、Listeria、</text>
<text x="840" y="88" class="" style="font-size:12px">Leishmania、Pneumocystis</text>
<text x="840" y="106" class="ts" style="">IFN-γ KO → 易感 mycobacteria</text>
<rect x="260" y="126" width="772" height="101" rx="10" class="br" style="stroke:none;opacity:.45"/>
<text x="112" y="180" class="tb" style="font-size:13px">IL-4</text>
<path d="M86 252 C98 252 90 176 106 176" class="ln" style="stroke-width:1.2;stroke:var(--safranin)"/>
<g class="hot" data-tip="&lt;b&gt;IL-4&lt;/b&gt; → &lt;b&gt;GATA3&lt;/b&gt; → TH2 → &lt;b&gt;IL-4&lt;/b&gt;（IgE）、&lt;b&gt;IL-5&lt;/b&gt;（eosinophil）、&lt;b&gt;IL-13&lt;/b&gt;（黏液、平滑肌收縮）；IL-4 + IL-13 → M2 macrophage。IL-3、IL-9 → mast cell。" data-label="TH2"><rect x="268" y="154" width="112" height="44" rx="22" class="br" style="stroke-width:1.6"/><text x="284" y="182" class="tb" style="font-size:15px">TH2</text></g>
<text x="368" y="182" text-anchor="end" class="ts" style="fill:var(--ink-2)">GATA3</text>
<path d="M380 176H390" class="lt"/>
<text x="400" y="146" class="tb" style="font-size:12px">IL-4</text>
<text x="458" y="146" style="font-size:12px">B 換 IgE、IgG1 → 武裝 mast cell</text>
<text x="400" y="164" class="tb" style="font-size:12px">IL-5</text>
<text x="458" y="164" style="font-size:12px">eosinophil 生長、活化（MBP 殺蟲、ADCC）</text>
<text x="400" y="180" class="tb" style="font-size:12px">IL-13</text>
<text x="458" y="180" style="font-size:12px">上皮更新、goblet cell 分泌黏液 → 寄生蟲脫落</text>
<text x="400" y="198" class="tb" style="font-size:12px">IL-13</text>
<text x="458" y="198" style="font-size:12px">腸道平滑肌收縮 → 排蟲</text>
<text x="400" y="214" class="tb" style="font-size:12px">IL-4+13</text>
<text x="458" y="214" style="font-size:12px">M2 macrophage（arginase-1）→ 組織修復</text>
<text x="742" y="164" class="tb" style="font-size:12px">eosinophil</text>
<text x="742" y="180" class="" style="font-size:12px">mast cell</text>
<text x="742" y="198" class="" style="font-size:12px">basophil</text>
<text x="840" y="164" class="" style="font-size:12px">helminth（寄生蟲）</text>
<text x="840" y="180" class="" style="font-size:12px">過敏（IgE）</text>
<text x="840" y="198" class="ts" style="">IL-4 KO → 沒有 TH2</text>
<rect x="260" y="235" width="772" height="67" rx="10" class="bg" style="stroke:none;opacity:.45"/>
<text x="112" y="264" class="tb" style="font-size:13px">IL-6</text>
<path d="M86 252 C98 252 90 268 106 268" class="ln" style="stroke-width:1.2;stroke:var(--good)"/>
<g class="hot" data-tip="&lt;b&gt;IL-6&lt;/b&gt; → &lt;b&gt;Bcl-6&lt;/b&gt; → TFH，在 B / T 交界與 follicle 幫 B 細胞。主要分泌 &lt;b&gt;IL-21&lt;/b&gt;（不是 IL-4）+ &lt;b&gt;CD40L&lt;/b&gt; → isotype switch、affinity maturation、memory B。" data-label="TFH"><rect x="268" y="246" width="112" height="44" rx="22" class="bg" style="stroke-width:1.6"/><text x="284" y="274" class="tb" style="font-size:15px">TFH</text></g>
<text x="368" y="274" text-anchor="end" class="ts" style="fill:var(--ink-2)">Bcl-6</text>
<path d="M380 268H390" class="lt"/>
<text x="400" y="256" class="tb" style="font-size:12px">IL-21</text>
<text x="458" y="256" style="font-size:12px">B 生長、germinal center 形成、class switch</text>
<text x="400" y="272" class="tb" style="font-size:12px">CD40L</text>
<text x="458" y="272" style="font-size:12px">接 B 的 CD40 → 缺了就是 hyper-IgM</text>
<text x="400" y="290" class="tb" style="font-size:12px">IL-4</text>
<text x="458" y="290" style="font-size:12px">TFH 也分泌 → IgE、IgG1</text>
<text x="742" y="256" class="tb" style="font-size:12px">B 細胞</text>
<text x="742" y="272" class="" style="font-size:12px">→ plasma cell</text>
<text x="742" y="290" class="" style="font-size:12px">→ memory B</text>
<text x="840" y="256" class="" style="font-size:12px">幾乎所有微生物</text>
<text x="840" y="272" class="" style="font-size:12px">（靠抗體）</text>
<text x="840" y="290" class="ts" style="">IL-21 KO → 抗體反應缺陷</text>
<rect x="260" y="310" width="772" height="84" rx="10" class="bw" style="stroke:none;opacity:.45"/>
<text x="112" y="330" class="tb" style="font-size:13px">TGF-β + IL-6</text>
<text x="112" y="346" class="ts">＋ IL-23</text>
<text x="112" y="362" class="ts">感染：TLR 活化 mDC</text>
<text x="112" y="380" class="ts">→ 給 IL-6</text>
<path d="M86 252 C98 252 90 352 106 352" class="ln" style="stroke-width:1.2;stroke:var(--warn)"/>
<g class="hot" data-tip="&lt;b&gt;TGF-β + IL-6&lt;/b&gt;（+ IL-23）→ &lt;b&gt;RORγt&lt;/b&gt; → TH17 → &lt;b&gt;IL-17&lt;/b&gt; → G-CSF、chemokines → &lt;b&gt;neutrophil&lt;/b&gt;；&lt;b&gt;IL-22&lt;/b&gt; → 抗菌肽。只有 TGF-β 不夠，要加 IL-6。" data-label="TH17"><rect x="268" y="330" width="112" height="44" rx="22" class="bw" style="stroke-width:1.6"/><text x="284" y="357" class="tb" style="font-size:15px">TH17</text></g>
<text x="368" y="357" text-anchor="end" class="ts" style="fill:var(--ink-2)">RORγt</text>
<path d="M380 352H390" class="lt"/>
<text x="400" y="330" class="tb" style="font-size:12px">IL-17</text>
<text x="458" y="330" style="font-size:12px">stromal cell 產 G-CSF → 骨髓增產 neutrophil</text>
<text x="400" y="348" class="tb" style="font-size:12px">IL-17</text>
<text x="458" y="348" style="font-size:12px">chemokines → 招募 neutrophil</text>
<text x="400" y="364" class="tb" style="font-size:12px">IL-22</text>
<text x="458" y="364" style="font-size:12px">上皮產抗菌肽、上皮更新</text>
<text x="400" y="382" class="tb" style="font-size:12px">CCL20</text>
<text x="458" y="382" style="font-size:12px">（↔ CCR6）招更多 TH17</text>
<text x="742" y="356" class="tb" style="font-size:12px">neutrophil</text>
<text x="840" y="339" class="" style="font-size:12px">胞外細菌（Klebsiella）</text>
<text x="840" y="356" class="" style="font-size:12px">真菌（Candida）</text>
<text x="840" y="373" class="ts" style="">不是對付病毒</text>
<rect x="260" y="402" width="772" height="67" rx="10" class="bp" style="stroke:none;opacity:.45"/>
<text x="112" y="422" class="tb" style="font-size:13px">TGF-β + IL-2</text>
<text x="112" y="438" class="ts">平時：共生菌 → iDC</text>
<text x="112" y="454" class="ts">→ 給 at-RA（腸腦軸）</text>
<path d="M86 252 C98 252 90 436 106 436" class="ln" style="stroke-width:1.2;stroke:var(--ink-3)"/>
<g class="hot" data-tip="&lt;b&gt;TGF-β + IL-2&lt;/b&gt; → &lt;b&gt;FoxP3&lt;/b&gt; → pTreg → &lt;b&gt;TGF-β、IL-10&lt;/b&gt; → 抑制免疫、peripheral tolerance。腸道共生菌：iDC 給 at-RA + TGF-β → pTreg；病原來了換 IL-6 → TH17。" data-label="pTreg"><rect x="268" y="414" width="112" height="44" rx="22" class="bp" style="stroke-width:1.6"/><text x="284" y="440" class="tb" style="font-size:15px">pTreg</text></g>
<text x="368" y="440" text-anchor="end" class="ts" style="fill:var(--ink-2)">FoxP3</text>
<path d="M380 436H390" class="lt"/>
<text x="400" y="422" class="tb" style="font-size:12px">TGF-β</text>
<text x="458" y="422" style="font-size:12px">抑制 TH1、TH2；B 換 IgA</text>
<text x="400" y="440" class="tb" style="font-size:12px">IL-10</text>
<text x="458" y="440" style="font-size:12px">抑制 TH1、抑制 macrophage 釋放 cytokine</text>
<text x="400" y="456" class="tb" style="font-size:12px">⇒</text>
<text x="458" y="456" style="font-size:12px">作用在 cDC → CD4 T 無法活化</text>
<text x="742" y="431" class="tb" style="font-size:12px">cDC</text>
<text x="742" y="448" class="" style="font-size:12px">（被抑制）</text>
<text x="840" y="422" class="" style="font-size:12px">自身、共生菌抗原</text>
<text x="840" y="440" class="" style="font-size:12px">→ peripheral tolerance</text>
<text x="840" y="456" class="ts" style="">IL-10 KO → IBD</text>
<circle cx="52" cy="252" r="34" class="bx" style="stroke-width:1.6"/><text x="52" y="248" text-anchor="middle" class="tb">naïve</text><text x="52" y="264" text-anchor="middle" class="ts">CD4⁺ T</text>
<text x="52" y="312" text-anchor="middle" class="ts">① TCR–pMHC</text><text x="52" y="326" text-anchor="middle" class="ts">② CD28–B7</text><text x="52" y="340" text-anchor="middle" class="ts">③ cytokine</text><text x="52" y="354" text-anchor="middle" class="ts">→ 決定分化</text>
<path d="M106 346H100V442H106" class="lv" style="stroke-width:1.4" />
<g class="hot" data-tip="同一個 &lt;b&gt;TGF-β&lt;/b&gt;，第二個訊號決定方向：&lt;b&gt;+ IL-6（+ IL-23）→ TH17&lt;/b&gt;；&lt;b&gt;+ IL-2 → pTreg&lt;/b&gt;。腸道：共生菌 → at-RA → pTreg；病原 → TLR → mDC 給 IL-6 → TH17。" data-label="TGF-β 分岔點"><rect x="60" y="383" width="40" height="22" rx="5" class="bv"/><text x="80" y="398" text-anchor="middle" class="tb tv" style="font-size:11px">分岔</text></g>
<path d="M16 487H1024" class="lt"/>
<text x="16" y="507" class="th">A · 亞群互相抑制（⊣）</text>
<rect x="36" y="536" width="68" height="30" rx="15" class="bv"/><text x="70" y="556" text-anchor="middle" class="tb">TH1</text>
<rect x="216" y="536" width="68" height="30" rx="15" class="br"/><text x="250" y="556" text-anchor="middle" class="tb">TH2</text>
<rect x="126" y="616" width="68" height="30" rx="15" class="bw"/><text x="160" y="636" text-anchor="middle" class="tb">TH17</text>
<rect x="346" y="616" width="68" height="30" rx="15" class="bp"/><text x="380" y="636" text-anchor="middle" class="tb">pTreg</text>
<path d="M106 545H210" class="ln" style="stroke-width:1.3" marker-end="url(#tf-i)"/>
<text x="160" y="539" text-anchor="middle" class="tb" style="font-size:11px">IFN-γ ⊣ TH2</text>
<path d="M214 557H110" class="ln" style="stroke-width:1.3" marker-end="url(#tf-i)"/>
<text x="160" y="573" text-anchor="middle" class="tb" style="font-size:11px">IL-4 ⊣ TH1</text>
<path d="M80 567L138 613" class="ln" style="stroke-width:1.3" marker-end="url(#tf-i)"/>
<text x="86" y="599" text-anchor="start" class="tb" style="font-size:11px">IFN-γ</text>
<path d="M240 567L182 613" class="ln" style="stroke-width:1.3" marker-end="url(#tf-i)"/>
<text x="234" y="599" text-anchor="end" class="tb" style="font-size:11px">IL-4</text>
<path d="M360 615L276 569" class="ln" style="stroke-width:1.3" marker-end="url(#tf-i)"/>
<text x="330" y="591" text-anchor="start" class="tb" style="font-size:11px">TGF-β</text>
<path d="M380 615C380 511 130 515 84 533" class="ln" style="stroke-width:1.3" marker-end="url(#tf-i)"/>
<text x="300" y="525" text-anchor="start" class="tb" style="font-size:11px">TGF-β、IL-10 ⊣ TH1</text>
<text x="16" y="675" class="ts">IL-4 或 IFN-γ 都抑制 TH17 發育；Treg 的 TGF-β 抑制 TH1、TH2，IL-10 抑制 TH1。</text>
<text x="520" y="507" class="th">B · INNATE 先上：ILC 分泌同一組 CYTOKINE</text>
<text x="590" y="529" class="ts">ILC（早、沒有抗體）</text><text x="790" y="529" class="ts">T 細胞</text><text x="840" y="529" class="ts">共同的效應</text>
<rect x="520" y="537" width="504" height="30" rx="7" class="bv" style="stroke:none;opacity:.45"/><text x="530" y="556" class="tb" style="font-size:12px">Type 1</text><text x="590" y="556" style="font-size:11.5px">ILC1（T-bet）</text><text x="790" y="556" class="tb" style="font-size:12px">TH1</text><text x="840" y="556" style="font-size:11.5px">IFN-γ → macrophage</text>
<rect x="520" y="573" width="504" height="30" rx="7" class="br" style="stroke:none;opacity:.45"/><text x="530" y="592" class="tb" style="font-size:12px">Type 2</text><text x="590" y="592" style="font-size:11.5px">ILC2（GATA3；IL-25、33、TSLP）</text><text x="790" y="592" class="tb" style="font-size:12px">TH2</text><text x="840" y="592" style="font-size:11.5px">IL-5、IL-13 → eosinophil、mast</text>
<rect x="520" y="609" width="504" height="30" rx="7" class="bw" style="stroke:none;opacity:.45"/><text x="530" y="628" class="tb" style="font-size:12px">Type 3</text><text x="590" y="628" style="font-size:11.5px">ILC3（RORγt；IL-23、IL-1）</text><text x="790" y="628" class="tb" style="font-size:12px">TH17</text><text x="840" y="628" style="font-size:11.5px">IL-17、IL-22 → neutrophil</text>
<text x="520" y="661" class="ts"><tspan class="tr" style="font-weight:650">陷阱</tspan>　IL-12 由 APC 分泌（不是 TH2）· TFH 主要分泌 IL-21（不是 IL-4）</text>
<text x="520" y="677" class="ts">　　　M1 = IFN-γ + CD40L（TH1）· M2 = IL-4 + IL-13（TH2）· TH17 不是對付病毒</text>
</svg>
