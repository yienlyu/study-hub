<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" role="img" aria-label="脂肪酸進入粒線體：細胞質中 acyl-CoA synthetase 耗 ATP 活化為 fatty acyl-CoA，CPT I 換成 acyl-carnitine（被 malonyl-CoA 抑制），translocase 送入基質，CPT II 換回 fatty acyl-CoA 進行 β-oxidation">
<defs><marker id="cs-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker>
<marker id="cs-av" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fv"/></marker>
<marker id="cs-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fr"/></marker>
<marker id="cs-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fg"/></marker></defs>
<rect x="20" y="40" width="190" height="316" rx="0" class="fp"/><rect x="254" y="40" width="80" height="316" rx="0" class="fp"/>
<rect x="378" y="40" width="362" height="316" style="fill:color-mix(in srgb, var(--violet) 9%, var(--card));stroke:var(--violet);stroke-width:1.2"/>
<rect x="210" y="40" width="44" height="316" class="bp"/>
<text x="232" y="30" text-anchor="middle" class="th">外膜</text>
<rect x="334" y="40" width="44" height="316" class="bp"/>
<text x="356" y="30" text-anchor="middle" class="th">內膜</text>
<text x="30" y="30" class="th">CYTOSOL</text><text x="262" y="30" class="th">膜間腔</text><text x="388" y="30" class="th">MATRIX</text>
<rect x="36" y="64" width="160" height="38" rx="10" class="bx"/><text x="116" y="88" text-anchor="middle" class="tb" style="font-size:13px">Fatty acid</text>
<path d="M116 102V130" class="ln" marker-end="url(#cs-a)" style="stroke-width:1.6"/>
<g class="hot" data-tip="在粒線體外膜（細胞質側）：FA + CoA + ATP → fatty acyl-CoA + <b>AMP + PPi</b>；PPi 被 pyrophosphatase 水解 → 等於耗 <b>2 個高能鍵（算 −2 ATP）</b>。" data-label="Acyl-CoA synthetase"><text x="124" y="120" class="ts">acyl-CoA synthetase</text></g>
<text x="36" y="148" class="tr" style="font-size:11.5px">ATP → AMP + PPi（→ 2Pi）</text><text x="36" y="163" class="tr tb" style="font-size:11.5px">＝ −2 ATP</text>
<rect x="36" y="176" width="160" height="38" rx="10" class="bw"/><text x="116" y="200" text-anchor="middle" class="tb" style="font-size:13px">Fatty acyl-CoA</text>
<path d="M196 195H250" class="ln" marker-end="url(#cs-a)" style="stroke-width:1.6"/>
<g class="hot" data-tip="Carnitine acyltransferase I（外膜）：acyl-CoA 的 CoA 換成 carnitine → <b>fatty acyl-carnitine</b>。<br><b>β-oxidation 的限速、調控點</b>；被 <b>malonyl-CoA</b>（脂肪酸合成的產物）抑制。" data-label="CPT I"><rect x="214" y="180" width="36" height="58" rx="12" class="br"/><text x="232" y="214" text-anchor="middle" class="tb" style="font-size:11px">CPT I</text></g>
<text x="260" y="214" class="ts">CoA-SH</text>
<rect x="258" y="226" width="72" height="38" rx="10" class="bw"/><text x="294" y="243" text-anchor="middle" class="tb" style="font-size:11.5px">Acyl-</text><text x="294" y="257" text-anchor="middle" class="tb" style="font-size:11.5px">carnitine</text>
<path d="M330 245H400" class="ln" marker-end="url(#cs-a)" style="stroke-width:1.6"/>
<g class="hot" data-tip="Acyl-carnitine/carnitine translocase（內膜）：一進一出，把 acyl-carnitine 送進基質、carnitine 送回膜間腔。" data-label="Translocase"><rect x="338" y="216" width="36" height="58" rx="8" class="bg"/><text x="356" y="250" text-anchor="middle" class="tb" style="font-size:12px">T</text></g>
<text x="356" y="290" text-anchor="middle" class="ts">translocase</text>
<path d="M400 318H260" class="lg dash" marker-end="url(#cs-ag)" style="stroke-width:1.4"/>
<text x="268" y="338" class="ts" style="fill:var(--good)">carnitine 回收</text>
<g class="hot" data-tip="Carnitine acyltransferase II（內膜的基質側）：acyl-carnitine + CoA → fatty acyl-CoA + carnitine。" data-label="CPT II"><rect x="402" y="216" width="40" height="58" rx="12" class="br"/><text x="422" y="250" text-anchor="middle" class="tb" style="font-size:10.5px">CPT II</text></g>
<path d="M442 245H480" class="ln" marker-end="url(#cs-a)" style="stroke-width:1.6"/>
<text x="444" y="286" class="ts">CoA-SH</text>
<rect x="482" y="226" width="130" height="38" rx="10" class="bw"/><text x="547" y="250" text-anchor="middle" class="tb" style="font-size:12.5px">Fatty acyl-CoA</text>
<path d="M612 245H640" class="ln" marker-end="url(#cs-a)" style="stroke-width:1.6"/>
<rect x="644" y="214" width="86" height="62" rx="10" class="bv"/><text x="687" y="240" text-anchor="middle" class="tb tv" style="font-size:12px">β-oxidation</text><text x="687" y="258" text-anchor="middle" class="ts">→ acetyl-CoA</text>
<rect x="36" y="268" width="150" height="36" rx="10" class="bx"/><text x="111" y="291" text-anchor="middle" class="tb" style="font-size:12.5px">Malonyl-CoA</text>
<path d="M186 286Q206 286 214 256" class="lr" style="stroke-width:2"/><path d="M206 252h16" class="lr" style="stroke-width:3"/>
<text x="36" y="324" class="tr" style="font-size:11.5px">脂肪酸合成時 ↑ → 抑制 CPT I</text>
<text x="392" y="72" class="tb" style="font-size:12px">能穿過內膜的：</text><text x="392" y="92" class="ts" style="fill:var(--good)">✓ fatty acyl-carnitine、malate、citrate、pyruvate</text><text x="392" y="110" class="ts" style="fill:var(--bad)">✗ fatty acyl-CoA、acetyl-CoA、malonyl-CoA</text>
</svg>
