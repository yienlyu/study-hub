<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="尿素循環：粒線體中 CPS I（NAG 活化）把 NH4+ 與 HCO3- 做成 carbamoyl phosphate，與 ornithine 生成 citrulline；細胞質中 citrulline 與 aspartate 生成 argininosuccinate，裂解為 arginine 與 fumarate，arginase 產生 urea 並再生 ornithine；fumarate 經 malate、OAA 回到 aspartate">
<defs><marker id="ur-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker>
<marker id="ur-av" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fv"/></marker>
<marker id="ur-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fr"/></marker>
<marker id="ur-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fg"/></marker></defs>
<rect x="20" y="40" width="270" height="350" rx="34" style="fill:color-mix(in srgb, var(--violet) 8%, var(--card));stroke:var(--violet);stroke-width:1.3"/>
<text x="40" y="30" class="th">粒線體基質</text><text x="320" y="30" class="th">細胞質</text>
<text x="40" y="70" class="tb" style="font-size:12px">NH₄⁺ ＋ HCO₃⁻ ＋ 2 ATP</text>
<path d="M90 78V114" class="ln" marker-end="url(#ur-a)" style="stroke-width:1.6"/>
<g class="hot" data-tip="Carbamoyl phosphate synthetase I（肝粒線體）：尿素循環的第一步、<b>調控點</b>。<b>N-acetylglutamate（NAG）是必需的別構活化劑</b>；NAG 由 acetyl-CoA + glutamate 經 NAG synthase 合成，arginine 活化 NAG synthase。CPS II 在細胞質，做 pyrimidine。" data-label="CPS I"><text x="98" y="100" class="tb tr" style="font-size:12px">CPS I</text></g>
<text x="140" y="100" class="ts" style="font-size:10.5px">← NAG（必需活化劑）</text>
<rect x="40" y="116" width="170" height="34" rx="10" class="bw"/><text x="125.0" y="138.0" text-anchor="middle" class="tb" style="font-size:11.5px">Carbamoyl phosphate</text>
<rect x="170" y="230" width="100" height="34" rx="10" class="bx"/><text x="220.0" y="252.0" text-anchor="middle" class="tb" style="font-size:12px">Ornithine</text>
<rect x="40" y="330" width="110" height="34" rx="10" class="bx"/><text x="95.0" y="352.0" text-anchor="middle" class="tb" style="font-size:12px">Citrulline</text>
<path d="M90 150V326" class="ln" marker-end="url(#ur-a)" style="stroke-width:1.6"/>
<path d="M206 264L136 326" class="ln" marker-end="url(#ur-a)" style="stroke-width:1.6"/>
<g class="hot" data-tip="Ornithine transcarbamoylase（粒線體）：carbamoyl phosphate + ornithine → citrulline。" data-label="Ornithine transcarbamoylase"><text x="104" y="300" class="tb" style="font-size:11px">OTC</text></g>
<path d="M150 347H338" class="ln" marker-end="url(#ur-a)" style="stroke-width:1.6"/>
<text x="244" y="340" text-anchor="middle" class="ts">運出</text>
<rect x="340" y="330" width="130" height="34" rx="10" class="bx"/><text x="405.0" y="352.0" text-anchor="middle" class="tb" style="font-size:12px">Citrulline</text>
<path d="M470 347H562" class="ln" marker-end="url(#ur-a)" style="stroke-width:1.6"/>
<text x="516" y="320" text-anchor="middle" class="tb" style="font-size:11.5px;fill:var(--violet)">＋Aspartate</text>
<text x="516" y="336" text-anchor="middle" class="ts" style="font-size:10px">＋ATP</text>
<rect x="564" y="330" width="176" height="34" rx="10" class="bx"/><text x="652.0" y="352.0" text-anchor="middle" class="tb" style="font-size:11.5px">Argininosuccinate</text>
<g class="hot" data-tip="步驟 2（細胞質）：citrulline + aspartate + ATP → argininosuccinate + AMP + PPi。<b>尿素的第二個氮來自 aspartate</b>。" data-label="Argininosuccinate synthetase"><text x="564" y="382" class="ts" style="font-size:10.5px">② argininosuccinate synthetase</text></g>
<path d="M652 330V246" class="ln" marker-end="url(#ur-a)" style="stroke-width:1.6"/>
<g class="hot" data-tip="步驟 3：argininosuccinate → arginine + <b>fumarate</b>。" data-label="Argininosuccinase"><text x="644" y="296" text-anchor="end" class="ts" style="font-size:10.5px">③ argininosuccinase</text></g>
<rect x="600" y="210" width="120" height="34" rx="10" class="bx"/><text x="660.0" y="232.0" text-anchor="middle" class="tb" style="font-size:12px">Arginine</text>
<text x="604" y="198" class="tb" style="font-size:12px;fill:var(--bad)">＋Fumarate</text>
<path d="M600 227H520" class="lg" marker-end="url(#ur-ag)" style="stroke-width:1.6"/>
<g class="hot" data-tip="步驟 4：arginine + H₂O → <b>urea</b> + ornithine。" data-label="Arginase"><text x="560" y="218" text-anchor="middle" class="ts" style="font-size:10.5px">④ arginase</text></g>
<rect x="430" y="210" width="88" height="34" rx="10" class="bg"/><text x="474.0" y="232.0" text-anchor="middle" class="tb" style="font-size:13px">Urea</text>
<text x="474" y="262" text-anchor="middle" class="ts" style="font-size:10.5px">2 個 N：NH₄⁺ ＋ Asp</text><text x="474" y="278" text-anchor="middle" class="ts" style="font-size:10.5px">C 來自 HCO₃⁻</text>
<path d="M560 210Q500 140 380 160Q310 175 272 236" class="ln" marker-end="url(#ur-a)" style="stroke-width:1.6"/>
<text x="420" y="140" text-anchor="middle" class="ts">Ornithine 運回粒線體</text>
<path d="M712 206V104" class="lr dash" style="stroke-width:1.4" marker-end="url(#ur-ar)"/>
<g class="hot" data-tip="<b>Fumarate → malate → OAA →（轉胺）→ aspartate</b>，aspartate 再進尿素循環。所以直接連接 TCA 與尿素循環的是 <b>fumarate 與 aspartate</b>。" data-label="Aspartate-argininosuccinate shunt"><text x="740" y="74" text-anchor="end" class="tb" style="font-size:11.5px">Aspartate-argininosuccinate shunt</text></g>
<text x="740" y="94" text-anchor="end" class="ts" style="font-size:10.5px">Fumarate → Malate → OAA → Aspartate（回到 ②）</text>
<text x="380" y="418" text-anchor="middle" class="ts" style="fill:var(--ink-2)">每個 urea 消耗 4 個高能磷酸鍵（3 ATP → 2 ADP + AMP）</text>
</svg>
