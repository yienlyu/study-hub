<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" role="img" aria-label="胰島素分泌：血糖經 GLUT2 進入 β 細胞，代謝使 ATP/ADP 上升，關閉 ATP 敏感 K+ 通道導致去極化，打開電壓門控 Ca2+ 通道，Ca2+ 流入觸發 insulin 顆粒胞吐；GLP-1、GIP 經 cAMP 加強分泌">
<defs><marker id="ie-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker>
<marker id="ie-av" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fv"/></marker>
<marker id="ie-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fr"/></marker>
<marker id="ie-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fg"/></marker></defs>
<rect x="70" y="40" width="600" height="300" rx="40" style="fill:color-mix(in srgb, var(--good) 6%, var(--card));stroke:var(--good);stroke-width:1.6"/>
<text x="96" y="68" class="th">胰臟 β 細胞</text>
<text x="14" y="100" class="tb" style="font-size:12px;fill:var(--bad)">血糖 ↑</text>
<g class="hot" data-tip="β 細胞用 <b>GLUT2</b>（Km 高）吸收葡萄糖，細胞內葡萄糖濃度跟著血糖走；再由 glucokinase（hexokinase IV）磷酸化，當作血糖感測器。" data-label="GLUT2"><rect x="48" y="108" width="44" height="30" rx="6" class="bg"/><text x="70" y="127" text-anchor="middle" class="tb" style="font-size:10px">GLUT2</text></g>
<path d="M92 123H128" class="ln" marker-end="url(#ie-a)" style="stroke-width:1.6"/>
<text x="134" y="118" class="tb" style="font-size:12px">Glucose → 糖解、TCA、</text><text x="134" y="136" class="tb" style="font-size:12px">氧化磷酸化</text>
<path d="M190 144V178" class="ln" marker-end="url(#ie-a)" style="stroke-width:1.6"/>
<text x="190" y="200" text-anchor="middle" class="tb tv" style="font-size:14px">ATP/ADP ↑</text>
<path d="M226 182L322 62" class="ln" marker-end="url(#ie-a)" style="stroke-width:1.6"/>
<g class="hot" data-tip="ATP-sensitive K⁺ 通道：ATP 結合後<b>關閉</b> → K⁺ 出不去 → 膜<b>去極化</b>。Sulfonylurea 類藥物直接關閉這個通道 → 促進 insulin 分泌。" data-label="K-ATP channel"><rect x="308" y="26" width="44" height="30" rx="6" class="br"/><text x="330" y="45" text-anchor="middle" class="tb" style="font-size:10px">K-ATP</text></g>
<text x="364" y="78" class="tb tr" style="font-size:12px">① K-ATP 通道關閉</text><text x="364" y="96" class="ts" style="font-size:10.5px">K⁺ 出不去（sulfonylurea 也能關）</text>
<path d="M330 58V132" class="ln" marker-end="url(#ie-a)" style="stroke-width:1.6"/>
<g class="hot" data-tip="K⁺ 外流停止 → 膜電位變得比較不負（去極化），達到電壓門控 Ca²⁺ 通道的開啟閾值。" data-label="去極化"><text x="342" y="150" class="tb" style="font-size:12.5px">② 膜去極化</text></g>
<path d="M330 160V318" class="ln" marker-end="url(#ie-a)" style="stroke-width:1.6"/>
<g class="hot" data-tip="電壓門控 Ca²⁺ 通道：去極化時打開 → Ca²⁺ 流入細胞。" data-label="Voltage-gated Ca²⁺ channel"><rect x="308" y="322" width="44" height="30" rx="6" class="bv"/><text x="330" y="341" text-anchor="middle" class="tb" style="font-size:10px">Ca²⁺</text></g>
<text x="364" y="316" class="tb" style="font-size:12px">③ 電壓門控 Ca²⁺ 通道打開</text>
<path d="M352 330Q440 330 470 272" class="lv" marker-end="url(#ie-av)" style="stroke-width:1.6"/>
<text x="478" y="272" class="tb tv" style="font-size:13px">Ca²⁺ ↑</text>
<path d="M500 256L540 224" class="ln" marker-end="url(#ie-a)" style="stroke-width:1.6"/>
<circle cx="560" cy="190" r="16" class="bw"/><text x="560" y="194" text-anchor="middle" class="ts" style="font-size:9.5px">Ins</text>
<circle cx="600" cy="214" r="16" class="bw"/><text x="600" y="218" text-anchor="middle" class="ts" style="font-size:9.5px">Ins</text>
<circle cx="574" cy="240" r="16" class="bw"/><text x="574" y="244" text-anchor="middle" class="ts" style="font-size:9.5px">Ins</text>
<circle cx="616" cy="170" r="16" class="bw"/><text x="616" y="174" text-anchor="middle" class="ts" style="font-size:9.5px">Ins</text>
<path d="M634 196H740" class="lg" marker-end="url(#ie-ag)" style="stroke-width:1.6"/>
<g class="hot" data-tip="Ca²⁺ 觸發含 insulin 的分泌顆粒與細胞膜融合 → insulin（與 C-peptide）釋入血液。" data-label="Insulin 胞吐"><text x="556" y="140" class="tb" style="font-size:12px">④ 顆粒胞吐</text></g>
<text x="680" y="222" class="tb" style="font-size:12px;fill:var(--good)">insulin</text><text x="680" y="238" class="ts" style="font-size:10px">＋C-peptide</text>
<g class="hot" data-tip="口服葡萄糖比靜脈注射引起<b>更多</b> insulin 分泌：腸道分泌的 GLP-1、GIP 經 GPCR → cAMP ↑ 加強分泌。" data-label="Incretin"><text x="96" y="270" class="tb" style="font-size:11.5px">Incretin effect</text></g>
<text x="96" y="288" class="ts">GLP-1、GIP（腸道）</text><text x="96" y="304" class="ts">→ cAMP ↑ 加強分泌</text>
</svg>
