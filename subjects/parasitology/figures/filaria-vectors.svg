<text x="12" y="312" class="th" style="paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round">斑虻 deerfly、mango fly</text>
<rect x="6" y="416" width="886" height="74" rx="14" class="fp"/>
<text x="12" y="410" class="th" style="paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round">黑蠅 blackfly</text>
