<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 898 866" role="img" aria-label="八種人體血絲蟲的病媒配對：蚊傳班氏、馬來、帝汶絲蟲，成蟲在淋巴管、微絲蚴在血液；斑虻傳羅阿絲蟲，成蟲在皮下移行、微絲蚴白天在血液；黑蠅傳蟠尾絲蟲，成蟲在皮下結節、微絲蚴在皮膚與眼睛；蠓傳 Mansonella perstans（體腔、血液）、M. streptocerca（真皮、皮膚），M. ozzardi 由蠓與黑蠅傳播（皮下、血液）。">
<defs><marker id="filaria-vectors-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fg"/></marker><marker id="filaria-vectors-fk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fk"/></marker><marker id="filaria-vectors-fr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fr"/></marker><marker id="filaria-vectors-fv" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="fv"/></marker></defs>
<rect x="6" y="24" width="886" height="270" rx="14" class="fp"/>
