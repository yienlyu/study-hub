<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 752" role="img" aria-label="三種血吸蟲完整比較。日本血吸蟲：雄蟲表皮平滑、腸道在體後三分之一會合、睪丸 6 到 8 顆排成一列、雌蟲卵巢在體中部、子宮內卵 50 到 300 個、每天產卵 3000 到 4000 個、卵圓形側刺短小、糞便、湖北釘螺。曼森血吸蟲：表皮結節明顯、腸道在體前三分之一會合、睪丸 6 到 9 顆散開、卵巢在體中線之前、子宮內卵 1 到 4 個、卵長卵圓形大側刺、糞便、雙臍扁螺。埃及血吸蟲：表皮結節細小、腸道在體中部會合、睪丸 4 到 5 顆擠成一團、卵巢在體中線之後、子宮內卵 20 到 30 個、卵紡錘形尾端刺、尿液、小泡螺。">
<text x="10" y="20" class="th">成蟲示意（左＝前端）· 蟲卵等比例 · 都沒有卵蓋 · ⬅＝老師紅箭頭標的鑑別點</text>
