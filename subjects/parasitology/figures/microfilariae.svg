<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-label="四種微絲蚴比較：班氏絲蟲有鞘、尾端無核、夜間在血液、家蚊傳播；馬來絲蟲有鞘、尾端兩顆核、夜間在血液、曼蚊傳播；羅阿絲蟲有鞘、核連續到尾尖、白天在血液、斑虻傳播；蟠尾絲蟲無鞘、尾端無核、在皮膚、黑蠅傳播。">
<text x="10" y="20" class="th">看三件事：有沒有鞘 · 尾端的核 · 在哪裡、什麼時候找</text>
<rect x="10" y="32" width="180" height="320" rx="12" class="bx"/>
