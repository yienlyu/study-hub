<text x="470.0" y="288" text-anchor="middle" class="ts">14</text>
<text x="270.0" y="306" text-anchor="middle" class="ts">追蹤時間（週）</text>
<path d="M70.0,40.0 H98.6 V68.8 H155.7 V97.5 H212.9 V126.2 H412.9 V174.2 H470.0" class="lv" style="stroke-width:2.6"/>
<g class="hot" data-tip="<b>設限（censored）</b>：失訪或研究結束時還活著。這兩人<b>不算死亡</b>，但之後不再列入分母（at risk 從 5 變 3）。" data-label="設限"><path d="M270.0 119.2v14" class="lr" style="stroke-width:2"/></g>
<g class="hot" data-tip="<b>設限（censored）</b>：失訪或研究結束時還活著。這兩人<b>不算死亡</b>，但之後不再列入分母（at risk 從 5 變 3）。" data-label="設限"><path d="M327.1 119.2v14" class="lr" style="stroke-width:2"/></g>
<path d="M70 155.0H412.9V270" class="lr dash"/>
<text x="78" y="149.0" class="ts tr">存活率降到 0.5 的時間 = 存活中位數 ≈ 12 週</text>
<text x="418.6" y="190.2" class="tb tv">0.417</text>
<rect x="492" y="40" width="278" height="170" rx="10" class="bp"/>
<text x="500" y="64" class="th">週</text>
<text x="556" y="64" class="th">at risk</text>
<text x="612" y="64" class="th">死亡</text>
<text x="668" y="64" class="th">該點存活</text>
<text x="724" y="64" class="th">累積</text>
<text x="500" y="90" style="font-size:12px">1</text>
<text x="556" y="90" style="font-size:12px">8</text>
<text x="612" y="90" style="font-size:12px">1</text>
<text x="668" y="90" style="font-size:12px">7/8</text>
<text x="724" y="90" class="tb tv" style="font-size:12px">0.875</text>
<text x="500" y="116" style="font-size:12px">3</text>
<text x="556" y="116" style="font-size:12px">7</text>
