<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" role="img" aria-label="Kaplan-Meier 存活曲線範例：8 位病人，第 1、3、5 週各死 1 人，第 7、9 週各有 1 人設限，第 12 週 3 人中死 1 人；累積存活率依序 0.875、0.75、0.625、0.417，存活中位數約 12 週。">

<text x="10" y="20" class="th">Kaplan-Meier：有人死亡時才重算 · 階梯狀 · 縱軸＝累積存活率</text>
