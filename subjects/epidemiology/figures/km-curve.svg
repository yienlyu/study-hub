<text x="612" y="142" style="font-size:12px">1</text>
<text x="668" y="142" style="font-size:12px">5/6</text>
<text x="724" y="142" class="tb tv" style="font-size:12px">0.625</text>
<text x="500" y="168" style="font-size:12px">7、9</text>
<text x="556" y="168" style="font-size:12px">—</text>
<text x="612" y="168" class="ts tr" style="font-size:12px">設限 2</text>
<text x="668" y="168" style="font-size:12px"></text>
<text x="724" y="168" style="font-size:12px"></text>
<text x="500" y="194" style="font-size:12px">12</text>
<text x="556" y="194" style="font-size:12px">3</text>
<text x="612" y="194" style="font-size:12px">1</text>
<text x="668" y="194" style="font-size:12px">2/3</text>
<text x="724" y="194" class="tb tv" style="font-size:12px">0.417</text>
<text x="500" y="236" class="ts">累積存活率 = 各死亡時間點存活率相乘</text>
<text x="500" y="254" class="ts">7/8 × 6/7 × 5/6 × 2/3 = 0.417（110、114 考古）</text>
<text x="500" y="276" class="ts">生命表法：固定間隔（每年）算；失訪者</text>
<text x="500" y="292" class="ts">假設只被觀察半段（人數 − withdraw × 0.5）</text>
</svg>
