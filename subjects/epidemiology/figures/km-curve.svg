<text x="298.6" y="288" text-anchor="middle" class="ts">8</text>
<path d="M355.7 270v5" class="ln"/>
<text x="355.7" y="288" text-anchor="middle" class="ts">10</text>
<path d="M412.9 270v5" class="ln"/>
<text x="412.9" y="288" text-anchor="middle" class="ts">12</text>
