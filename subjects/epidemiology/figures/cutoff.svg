<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 344" role="img" aria-label="切點取捨：健康人與病人的檢驗值分布重疊。切點左邊的病人是偽陰性，右邊的健康人是偽陽性。切點降低則敏感度上升、特異度下降；提高則相反。共筆例：血糖切點 80 敏感度 100%、特異度 17.7%；切點 200 敏感度 39.2%、特異度 100%。">

