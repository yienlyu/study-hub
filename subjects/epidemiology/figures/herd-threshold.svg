<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-label="群體免疫閾值等於一減 R0 分之一：流感 R0 1.3 約需 23%，R0 2 需 50%，COVID Delta R0 5.1 約 80%，麻疹 R0 12 到 18 需 92 到 94%。R0 小於 1 疾病消失，等於 1 為地方性，大於 1 成為流行。">

