<rect x="548" y="40" width="222" height="230" rx="12" class="bp"/>
<text x="562" y="64" class="th">R₀ 與 Rt</text>
<text x="562" y="88" style="font-size:12px">R₀ < 1 → 逐漸消失</text>
<text x="562" y="108" style="font-size:12px">R₀ = 1 → 地方性（endemic）</text>
<text x="562" y="128" style="font-size:12px">R₀ > 1 → 指數散布（epidemic）</text>
<text x="562" y="156" class="ts">Rt：有防疫措施時的實際傳播數</text>
<text x="562" y="172" class="ts">Rt 持續 < 1 → 疫情受控制</text>
<text x="562" y="200" class="th">群體免疫成立條件</text>
<text x="562" y="220" class="ts">單一宿主、直接傳播、</text>
<text x="562" y="236" class="ts">沒有保毒宿主、感染後免疫穩固</text>
<text x="562" y="256" class="ts tr">R₀ 大 ≠ 病毒毒性強</text>
</svg>
