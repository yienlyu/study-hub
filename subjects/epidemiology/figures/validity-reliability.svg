<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" role="img" aria-label="打靶圖說明效度與信度：點落在靶心附近代表效度高，點彼此集中代表信度高。四種組合：效度高信度高、效度低信度高（集中但偏離靶心）、效度高信度低、效度低信度低。">

<text x="10" y="20" class="th">效度＝準不準（離靶心多遠）· 信度＝穩不穩（點有多集中）</text>
