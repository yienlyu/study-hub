<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Study Hub</title>
    <meta
      name="description"
      content="多科目複習網站：重點整理、上課 slides 重點、考點分析、互動式考古練習與模擬新題。"
    />
    <meta
      name="theme-color"
      content="#f5f2eb"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121110"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f5f2eb' stroke='%2317150f' stroke-width='2'/%3E%3Ccircle cx='12' cy='13' r='4' fill='%234a2fbd'/%3E%3Ccircle cx='20.5' cy='18.5' r='3' fill='%23d8426f'/%3E%3Ccircle cx='13' cy='21.5' r='1.8' fill='%2317150f'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      href="assets/fonts/instrument-serif-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="assets/style.css?v=20261002e" />
    <script>
      try {
        const t = JSON.parse(localStorage.getItem("sh:theme"));
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <script src="assets/marked.min.js?v=12.0.2" defer></script>
  </head>
  <body>
    <a class="skip" href="#app">跳到主要內容</a>
    <header class="masthead" id="masthead">
      <div class="wrap">
        <a class="logo" href="#/" aria-label="Study Hub 首頁">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle
              cx="16"
              cy="16"
              r="14"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <circle
              cx="16"
              cy="16"
              r="10.5"
              fill="none"
              stroke="currentColor"
              stroke-width=".8"
              opacity=".35"
            />
            <circle cx="12.5" cy="13" r="3.6" fill="var(--violet)" />
            <circle cx="20.5" cy="18.5" r="2.7" fill="var(--safranin)" />
            <circle cx="13" cy="21.3" r="1.6" fill="currentColor" />
          </svg>
          Study Hub
        </a>
        <nav class="mainnav" id="mainnav" aria-label="主選單"></nav>
        <span class="mast-spacer"></span>
        <button
          class="search-trigger"
          id="searchBtn"
          type="button"
          aria-label="搜尋章節、考點與題目"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <span>搜尋章節、考點、題目</span><kbd id="kbdHint">Ctrl K</kbd>
        </button>
        <button
          class="icon-btn"
          id="themeBtn"
          type="button"
          aria-label="切換深色 / 淺色模式"
        ></button>
      </div>
      <div class="read-progress" id="readProgress"></div>
    </header>

    <main id="app" tabindex="-1">
      <div class="boot" aria-label="載入中">
        <span></span><span></span><span></span>
      </div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="快速切換"></nav>

    <footer class="site-footer">
      <div class="wrap">
        <div>
          <div class="sig">Study Hub</div>
          <div style="margin-top: 10px">
            資料來源：上課 slides、113 共筆、113／111 考古。內容僅供複習參考。
          </div>
        </div>
        <div style="display: flex; gap: 18px; flex-wrap: wrap">
          <a href="#/report">回報 / 回饋</a>
          <a
            href="https://github.com/yienlyu/study-hub"
            id="repoLink"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
          <span>按 <kbd>/</kbd> 搜尋</span>
        </div>
      </div>
    </footer>

    <div class="cmdk-backdrop" id="cmdk" hidden></div>
    <div class="tip" id="tip" aria-hidden="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="config.js?v=20261002e"></script>
    <script src="assets/app.js?v=20261002e" defer></script>
  </body>
</html>
